*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
#nav{background:var(--primary);color:#fff;padding:0 20px;display:flex;align-items:center;gap:16px;height:54px;}
#nav h1{font-size:1.1rem;font-weight:700;flex:1;}
#nav-user{font-size:.85rem;opacity:.85;}
.btn-nav{background:rgba(255,255,255,.18);border:none;color:#fff;padding:5px 14px;border-radius:20px;cursor:pointer;font-size:.82rem;}

#app{display:none;max-width:1140px;margin:24px auto;padding:0 16px;}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:8px 18px;border:none;background:none;cursor:pointer;font-size:.9rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.card h2{font-size:1rem;font-weight:600;margin-bottom:14px;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.client-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .15s;}
.client-card:hover{border-color:var(--primary);box-shadow:0 2px 10px rgba(41,171,226,.12);}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end;}
label{font-size:.82rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;}
input,select,textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:.9rem;font-family:inherit;background:#fff;}

textarea{resize:vertical;min-height:60px;}

.btn-danger{background:var(--danger);color:#fff;}
.btn-warn{background:var(--warn);color:#fff;}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
.btn-sm{padding:5px 14px;font-size:.82rem;}
.btn-xs{padding:2px 8px;font-size:.75rem;}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600;}
.badge-green{background:#dcfce7;color:#166534;}
.badge-blue{background:#dbeafe;color:#1e40af;}
.badge-gray{background:#f1f5f9;color:#475569;}
.badge-yellow{background:#fef3c7;color:#92400e;}
.badge-purple{background:#e8f6fd;color:#1a7fad;}
.badge-red{background:#fee2e2;color:#991b1b;}
.badge-orange{background:#ffedd5;color:#9a3412;}
/* Lesson cards */
details.lesson-card>summary::-webkit-details-marker{display:none;}
details summary button{pointer-events:all;}
details summary .status-btn{pointer-events:all;}
details.lesson-card .lesson-body button,details.lesson-card .lesson-body input,details.lesson-card .lesson-body select,details.lesson-card .lesson-body textarea{pointer-events:all;}

details.lesson-card>summary>span:first-child{transition:transform .15s;display:inline-block;}
.lesson-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
.lesson-header{padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:#fafafa;flex-wrap:wrap;}

.lesson-body{padding:16px;}

// Keepalive: ping Supabase once every 24h so the free-tier project never pauses
(function keepAlive(){
  const INTERVAL=24*60*60*1000;
  function ping(){
    fetch(SUPABASE_URL+'/rest/v1/users?limit=1',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    }).catch(()=>{});
  }
  ping();
  setInterval(ping,INTERVAL);

// ── Supabase REST helper ──
async function sbFetch(table,method='GET',body=null,params=''){
  const url=SUPABASE_URL+'/rest/v1/'+table+(params?'?'+params:'');
  const opts={method,headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...((method==='POST'||method==='PATCH')?{'Prefer':'return=representation'}:{})}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  if(!r.ok){const t=await r.text();console.error('sbFetch error',table,method,r.status,t);return null;}
  if(method==='DELETE'||r.status===204)return true;
  return r.json();
}
async function sbUpsert(table,body){
  const url=SUPABASE_URL+'/rest/v1/'+table;
  try{
    const r=await fetch(url,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});
    if(!r.ok){const t=await r.text();console.error('sbUpsert error',table,r.status,t);toast('⚠ Save error ('+table+'): '+r.status+' — '+t.slice(0,80),5000);return null;}
    return r.json();
  }catch(e){console.error('sbUpsert fetch failed',table,e);toast('⚠ Network error saving '+table,4000);return null;}
}

function bipToRow(b){return{id:b.id,client_id:b.clientId,name:b.name,measurement:b.measurement||null,measurements:b.measurements||[],functions:b.functions||[],description:b.description||null,antecedent:b.antecedent||null,competing:b.competing||null,replacement:b.replacement||null,teaching_strategy:b.teachingStrategy||null,consequence:b.consequence||null,extinction:b.extinction||null,safety:b.safety||null,goal:b.goal||null,baseline:b.baseline||null,sup_note:b.supNote||null,created_date:b.createdDate||null};}

function sessionToRow(s){return{id:s.id,client_id:s.clientId,date:s.date,tx_id:s.txId||null,tx_name:s.txName||null,sess_time:s.sessTime||null,sess_type:s.sessType||'overlap',notes:s.notes||null,lesson_data:s.lessonData||[],bip_data:s.bipData||[],abc_data:s.abcData||[]};}

// ── Load all data from Supabase ──
async function loadFromSupabase(){
  showSyncStatus('loading');
  try{
    // Fetch each table independently so one failure doesn't block login
    const safe=async(table,params)=>{try{const r=await sbFetch(table,'GET',null,params);return Array.isArray(r)?r:[];}catch(e){console.warn('Load failed:',table,e);return [];}};
    const users   = await safe('users','select=*');
    const clients  = await safe('clients','select=*');
    const lessons  = await safe('lessons','select=*');
    const bips    = await safe('bips','select=*');
    const sessions = await safe('sessions','select=*&order=date.asc');
    const behaviors= await safe('behaviors','select=*&order=date.asc');

    console.log('Loaded — users:',users.length,'clients:',clients.length,'lessons:',lessons.length);

    DB.users   = users.map(rowToUser);
    DB.clients  = clients.map(rowToClient);
    DB.lessons  = lessons.map(rowToLesson);
    DB.bips    = bips.map(rowToBIP);
    DB.sessions = sessions.map(rowToSession);
    DB.behaviors= behaviors.map(r=>({id:r.id,clientId:r.client_id,bipId:r.bip_id,date:r.date,function:r.func,count:r.count,duration:r.duration,avgDuration:r.avg_duration,rate:r.rate,notes:r.notes,txId:r.tx_id,txName:r.tx_name}));

    // Seed default users if none exist
    if(!DB.users.length){
      const def=defaultData();
      await Promise.all(def.users.map(u=>sbUpsert('users',userToRow(u))));
      DB.users=def.users;
      console.log('Seeded default users');
    }
    hideSyncStatus();
    return true;
  }catch(e){
    console.error('loadFromSupabase fatal:',e);
    showSyncStatus('error');
    return false;
  }
}

// ── saveData: push ALL dirty records (called on any change) ──
// We keep DB in memory and push to Supabase on every mutation
let _saveQueue={};
let _saveTimer=null;
function saveData(){
  // Immediate save — no debounce risk
  _saveTimer&&clearTimeout(_saveTimer);
  _saveTimer=setTimeout(flushSave,300);
}
async function flushSave(){
  showSyncStatus('saving');
  try{
    // Push everything currently in DB to Supabase
    await Promise.all([
      ...DB.clients.map(c=>sbUpsert('clients',clientToRow(c))),
      ...DB.lessons.map(l=>sbUpsert('lessons',lessonToRow(l))),
      ...(DB.bips||[]).map(b=>sbUpsert('bips',bipToRow(b))),
      ...(DB.behaviors||[]).map(b=>sbUpsert('behaviors',{id:b.id,client_id:b.clientId,bip_id:b.bipId,date:b.date,func:b.function,count:b.count||null,duration:b.duration||null,avg_duration:b.avgDuration||null,rate:b.rate||null,notes:b.notes||null,tx_id:b.txId||null,tx_name:b.txName||null})),
    ]);
    hideSyncStatus();
  }catch(e){
    console.error('Save error',e);
    showSyncStatus('error');
  }
}

  if(state==='saving'){el.style.background='#fef3c7';el.style.color='#92400e';el.textContent='⟳ Saving...';el.style.opacity='1';}
  else if(state==='loading'){el.style.background='#dbeafe';el.style.color='#1e40af';el.textContent='⟳ Loading...';el.style.opacity='1';}

// ── Archive / Restore ────────────────────────────────────────────────────────
async function archiveSessions(){
  const monthEl=document.getElementById('archive-month');
  if(!monthEl||!monthEl.value){alert('Please select a month to archive up to.');return;}
  const cutoff=monthEl.value; // e.g. "2026-03"
  const cutoffEnd=cutoff+'-31'; // sessions with date <= this are archived

  const archSessions=DB.sessions.filter(s=>s.date<=cutoffEnd);
  const archBehaviors=DB.behaviors.filter(b=>b.date<=cutoffEnd);

  if(!archSessions.length&&!archBehaviors.length){
    alert('No session data found up to '+cutoff+'.');return;
  }

  if(!confirm('Archive '+archSessions.length+' sessions and '+archBehaviors.length+' behavior records up to end of '+cutoff+'?\nThis will remove them from the database after downloading.'))return;

  // Download archive file
  const archive={
    archivedAt:new Date().toISOString(),
    archiveUpTo:cutoff,
    sessions:archSessions,
    behaviors:archBehaviors
  };
  const b=new Blob([JSON.stringify(archive,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='archive_'+cutoff+'.json';
  a.click();

  // Delete from Supabase
  for(const s of archSessions){
    await sbFetch('sessions','DELETE',null,'id=eq.'+s.id);
  }
  for(const bx of archBehaviors){
    await sbFetch('behaviors','DELETE',null,'id=eq.'+bx.id);
  }

  // Update local DB
  DB.sessions=DB.sessions.filter(s=>s.date>cutoffEnd);
  DB.behaviors=DB.behaviors.filter(b=>b.date>cutoffEnd);

  toast('Archived '+archSessions.length+' sessions ✓');
  render();
}

async function restoreArchive(file){
  const r=new FileReader();
  r.onload=async e=>{
    try{
      const arc=JSON.parse(e.target.result);
      const sessions=arc.sessions||[];
      const behaviors=arc.behaviors||[];
      if(!sessions.length&&!behaviors.length){alert('No session data found in file.');return;}
      if(!confirm('Load '+sessions.length+' sessions and '+behaviors.length+' behavior records from archive '+arc.archiveUpTo+'?\nThis will merge into current data.'))return;

      // Merge — skip duplicates
      const existIds=new Set(DB.sessions.map(s=>s.id));
      const newSess=sessions.filter(s=>!existIds.has(s.id));
      const existBxIds=new Set(DB.behaviors.map(b=>b.id));
      const newBx=behaviors.filter(b=>!existBxIds.has(b.id));

      // Save to Supabase
      for(const s of newSess) await sbUpsert('sessions',sessionToRow(s));
      for(const bx of newBx) await sbUpsert('behaviors',{id:bx.id,client_id:bx.clientId,bip_id:bx.bipId,date:bx.date,func:bx.function,count:bx.count,duration:bx.duration,avg_duration:bx.avgDuration,rate:bx.rate,notes:bx.notes,tx_id:bx.txId,tx_name:bx.txName});

      DB.sessions=[...DB.sessions,...newSess].sort((a,b)=>a.date.localeCompare(b.date));
      DB.behaviors=[...DB.behaviors,...newBx].sort((a,b)=>a.date.localeCompare(b.date));

      toast('Restored '+newSess.length+' sessions ✓');
      render();
    }catch(x){alert('Invalid archive file.');}
  };
  r.readAsText(file);
}

function importDB(file){const r=new FileReader();r.onload=async e=>{try{const imp=JSON.parse(e.target.result);DB=imp;await flushSave();toast('Imported & synced!');render();}catch(x){alert('Invalid file.');}};r.readAsText(file);}

// ── SVG sparkline for supervision PDF ──
function makeSVGSparkline(scores,masteryPct){
  // scores: [{date,pct}], masteryPct: number
  if(!scores||!scores.length)return'';
  const W=320,H=80,pad=30;
  const vals=scores.map(s=>s.pct);
  const min=0,max=100;
  const xStep=(W-pad*2)/(Math.max(scores.length-1,1));
  const yScale=v=>H-pad-(v-min)/(max-min)*(H-pad*2);
  // polyline points
  const pts=scores.map((s,i)=>(pad+i*xStep).toFixed(1)+','+yScale(s.pct).toFixed(1)).join(' ');
  // mastery line y
  const my=yScale(masteryPct||80).toFixed(1);
  // x-axis labels (every point if <=5, else first/last)
  const labels=scores.map((s,i)=>{
    const x=(pad+i*xStep).toFixed(1);
    const y=(H-8).toFixed(1);
    if(scores.length<=5||i===0||i===scores.length-1)
      return'<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="9" fill="#64748b">'+s.date.slice(5)+'</text>';
    return'';
  }).join('');
  // y-axis labels
  const yLabels=[0,25,50,75,100].map(v=>{
    const y=yScale(v).toFixed(1);
    return'<text x="'+(pad-4)+'" y="'+y+'" text-anchor="end" dominant-baseline="middle" font-size="9" fill="#94a3b8">'+v+'%</text>';
  }).join('');
  // dots
  const dots=scores.map((s,i)=>{
    const cx=(pad+i*xStep).toFixed(1),cy=yScale(s.pct).toFixed(1);
    return'<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#29ABE2" stroke="white" stroke-width="1.5"/>';
  }).join('');
  return'<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" style="display:block;margin:6px 0">'
    +'<rect width="'+W+'" height="'+H+'" fill="#f8fafc" rx="4"/>'
    +'<line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(H-pad)+'" stroke="#e2e8f0" stroke-width="1"/>'
    +'<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#e2e8f0" stroke-width="1"/>'
    +yLabels
    +'<line x1="'+pad+'" y1="'+my+'" x2="'+(W-pad)+'" y2="'+my+'" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>'
    +'<polyline points="'+pts+'" fill="none" stroke="#29ABE2" stroke-width="2" stroke-linejoin="round"/>'
    +dots+labels
    +'</svg>';
}
function finishSupervision(){
  const sv=getSupState();
  if(!sv.started||!sv.snap){clearSupState();render();return;}
  const snap=sv.snap;
  const now=snapshotClient();
  const changes=[];
  const c=DB.clients.find(x=>x.id===selectedClientId);

  // ── Notes ──
  const newNotes=(c.notes||[]).filter(n=>!snap.clientNotes.find(o=>o.id===n.id));
  if(newNotes.length)changes.push({section:'Client Notes',items:newNotes.map(n=>({label:n.date+' ('+n.authorName+')',value:n.text}))});

  // ── Reinforcers ──
  const newR=(c.reinforcers||[]).filter(r=>!snap.reinforcers.find(o=>o.name===r.name));
  const delR=snap.reinforcers.filter(r=>!(c.reinforcers||[]).find(o=>o.name===r.name));
  const rItems=[];
  newR.forEach(r=>rItems.push({label:'Added: '+r.name+(r.type?' ('+r.type+')':''),value:r.note||''}));
  delR.forEach(r=>rItems.push({label:'Removed: '+r.name,value:''}));
  if(rItems.length)changes.push({section:'Reinforcer List',items:rItems});

  // ── Lessons ──
  const lessons=DB.lessons.filter(l=>l.clientId===selectedClientId);
  lessons.forEach(l=>{
    const snapL=snap.lessons.find(x=>x.id===l.id);
    const lItems=[];
    // Phase change
    if(snapL&&snapL.phase!==l.phase)lItems.push({label:'Phase changed: '+snapL.phase+' → '+l.phase,value:''});
    // New sup notes
    const snapNotes=snapL?snapL.supNotes||[]:[];
    const newSN=(l.supNotes||[]).filter(n=>!snapNotes.find(o=>o.date===n.date&&o.text===n.text));
    newSN.forEach(n=>{
      // Gather recent session data for all targets in this lesson
      const sessLines=[];
      l.sds.forEach(sd2=>{
        sd2.targets.forEach(t2=>{
          const scores=[];
          DB.sessions.filter(s=>s.clientId===selectedClientId).forEach(s=>{
            const ld=s.lessonData&&s.lessonData.find(x=>x.lessonId===l.id);
            if(!ld)return;
            (ld.targets||[]).forEach(td=>{
              if(td.targetId===t2.id&&td.pct!=null&&!td.na)
                scores.push({date:s.date,pct:Math.round(td.pct)});
            });
          });
          if(scores.length) sessLines.push({name:t2.name,scores:scores.slice(-8),masteryPct:l.masteryRule&&l.masteryRule.pct||80});
        });
      });
      // Build HTML detail with note text + sparkline charts
      const noteParas=n.text.split(/\n+/).filter(s=>s.trim()).map(p=>'<p style="font-size:.83rem;margin:0 0 5px 0;line-height:1.55">'+esc(p)+'</p>').join('');
      const graphsHtml=sessLines.map(g=>'<div style="margin-top:8px"><div style="font-size:.78rem;font-weight:600;color:#334155;margin-bottom:2px">'+esc(g.name)+'</div>'+makeSVGSparkline(g.scores,g.masteryPct)+'</div>').join('');
      lItems.push({label:'New program note',value:n.text,html:noteParas+(graphsHtml?'<div style="margin-top:6px;border-top:1px solid #f1f5f9;padding-top:6px"><div style="font-size:.74rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Session Data</div>'+graphsHtml+'</div>':'')});
    });
    // Target changes
    l.sds.forEach(sd=>{
      const snapSd=snapL&&snapL.sds.find(x=>x.id===sd.id);
      sd.targets.forEach(t=>{
        const snapT=snapSd&&snapSd.targets.find(x=>x.id===t.id);
        if(!snapT){
          // Build full target detail for new target
          const lines=[];
          lines.push('Lesson: '+l.name);
          if(sd.sd)lines.push('SD: '+sd.sd);
          if(sd.response)lines.push('R: '+sd.response);
          lines.push('Target: '+t.name);
          if(t.dataType)lines.push('Data type: '+t.dataType+(t.trialCount?' ('+t.trialCount+' trials)':''));
          if(t.teachingSteps&&t.teachingSteps.length)lines.push('Teaching steps:\n'+t.teachingSteps.map((s,i)=>'  '+(i+1)+'. '+s).join('\n'));
          // Any existing scores for this target?
          const existScores=[];
          DB.sessions.filter(s=>s.clientId===selectedClientId).forEach(s=>{
            const ld=s.lessonData&&s.lessonData.find(x=>x.lessonId===l.id);
            if(!ld)return;
            (ld.targets||[]).forEach(td=>{if(td.targetId===t.id&&td.pct!=null&&!td.na)existScores.push(s.date.slice(5)+' '+Math.round(td.pct)+'%');});
          });
          if(existScores.length)lines.push('Recent data: '+existScores.slice(-5).join(', '));
          lItems.push({label:'New target added: '+t.name,value:lines.join('\n')});
        }
        else{
          if(snapT.status!==t.status){
          // Get recent scores for this target
          const tScores=[];
          DB.sessions.filter(s=>s.clientId===selectedClientId).forEach(s=>{
            const ld=s.lessonData&&s.lessonData.find(x=>x.lessonId===l.id);
            if(!ld)return;
            (ld.targets||[]).forEach(td=>{if(td.targetId===t.id&&td.pct!=null&&!td.na)tScores.push(s.date.slice(5)+' '+Math.round(td.pct)+'%');});
          });
          const scoreStr=tScores.length?'\nRecent data: '+tScores.slice(-5).join(', '):'';
          lItems.push({label:t.name+': status '+snapT.status+' → '+t.status,value:'SD: '+(sd.sd||'—')+'\nR: '+(sd.response||'—')+scoreStr});
        }
          if((snapT.dtStepIndex||0)!==(t.dtStepIndex||0))lItems.push({label:t.name+': step advanced to step '+((t.dtStepIndex||0)+1),value:'Lesson: '+l.name+'\nSD: '+(sd.sd||'—')+'\nStep: '+(t.teachingSteps&&t.teachingSteps[t.dtStepIndex||0]||'')});
        }
      });
    });
    if(lItems.length)changes.push({section:'Program: '+l.name,items:lItems});
  });

  // ── BIPs ──
  const bips=(DB.bips||[]).filter(b=>b.clientId===selectedClientId);
  const bipFields=['description','competing','antecedent','replacement','teachingStrategy','consequence','extinction','safety','goal','baseline','functions'];
  const bipLabels={description:'Definition',antecedent:'Antecedent Modification',competing:'Environment Setup',replacement:'Replacement Behavior',teachingStrategy:'Teaching Strategy',consequence:'Consequence Manipulation',extinction:'Extinction Protocol',safety:'Safety Plan',goal:'Goal',baseline:'Baseline',functions:'Functions'};
  bips.forEach(b=>{
    const snapB=snap.bips.find(x=>x.id===b.id);
    const bItems=[];
    if(!snapB){bItems.push({label:'New BIP added',value:b.name});}
    else{
      bipFields.forEach(f=>{
        const ov=snapB[f],nv=b[f];
        const ovs=Array.isArray(ov)?ov.join(', '):(ov||'');
        const nvs=Array.isArray(nv)?nv.join(', '):(nv||'');
        if(ovs!==nvs){
          // Build html: bold label then value paragraphs
          const lbl=bipLabels[f]||f;
          const paras=nvs.split(/\n+/).filter(s=>s.trim());
          const paraHtml=paras.map(p=>'<p style="font-size:.83rem;margin:0 0 5px 0;line-height:1.55">'+esc(p)+'</p>').join('');
          const html='<p style="font-size:.8rem;font-weight:700;color:#1e293b;margin:0 0 4px 0">'+esc(lbl)+'</p>'+paraHtml;
          bItems.push({label:bipLabels[f]||f,value:nvs,html:html});
        }
      });
    }
    if(bItems.length){
      // Any BIP change → include full current BIP
      const allFieldsHtml=bipFields.map(f=>{
        const val=Array.isArray(b[f])?b[f].join(', '):(b[f]||'');
        if(!val)return'';
        const lbl=bipLabels[f]||f;
        const paras=val.split(/\n+/).filter(s=>s.trim());
        const paraHtml=paras.map(p=>'<p style="font-size:.83rem;margin:0 0 5px 0;line-height:1.55">'+esc(p)+'</p>').join('');
        return'<div style="margin-bottom:8px"><p style="font-size:.8rem;font-weight:700;color:#29ABE2;margin:0 0 3px 0">'+esc(lbl)+'</p>'+paraHtml+'</div>';
      }).join('');
      const changedFields=bItems.map(x=>x.label).join(', ');
      const summaryHtml='<div style="margin-bottom:10px;padding:6px 10px;background:#fef9c3;border-radius:6px;font-size:.78rem;color:#854d0e"><strong>Updated fields:</strong> '+esc(changedFields)+'</div>';
      changes.push({section:'BIP: '+b.name,items:[{label:'Full BIP (updated)',html:summaryHtml+allFieldsHtml}]});
    }
  });

  if(!changes.length){
    modal('<div style="text-align:center;padding:20px"><div style="font-size:2rem;margin-bottom:8px">✅</div><h3>No Changes Detected</h3><p style="color:var(--muted);margin-top:8px">Nothing was modified during this supervision visit.</p><div style="margin-top:16px"><button class="btn btn-outline" onclick="closeModal();clearSupState();render()">Close</button></div></div>');
    return;
  }

  // Store changes for PDF print
  window._supChanges={changes,sv,clientName:c.name};

  // ── Preview modal ──
  const sectionsHtml=changes.map(sec=>{
    const itemsHtml=sec.items.map(it=>{
      // Use pre-built .html if available (e.g. sparklines), else render .value as paragraphs
      let bodyHtml='';
      if(it.html){
        bodyHtml=it.html;
      } else {
        const paras=(it.value||'').split(/\n+/).filter(s=>s.trim());
        bodyHtml=paras.map(p=>'<p style="font-size:.83rem;margin:0 0 6px 0;line-height:1.55;color:#1e293b">'+esc(p)+'</p>').join('');
      }
      return '<div style="margin-bottom:10px;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden">'
        +'<div style="background:#eff6ff;padding:5px 12px;font-size:.76rem;font-weight:700;color:#29ABE2;border-bottom:1px solid #e5e7eb">'+esc(it.label)+'</div>'
        +(bodyHtml?'<div style="padding:8px 12px">'+bodyHtml+'</div>':'')
        +'</div>';
    }).join('');
    return '<div style="margin-bottom:16px">'
      +'<div style="font-size:.78rem;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid #e5e7eb">'+esc(sec.section)+'</div>'
      +itemsHtml+'</div>';
  }).join('');

  const totalChanges=changes.reduce((a,s)=>a+s.items.length,0);
  modal('<div style="max-width:620px">'
    +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'
    +'<h3 style="flex:1;margin:0">📄 Supervision Summary</h3>'
    +'<span style="background:#eff6ff;color:#1a7fad;border-radius:6px;padding:3px 10px;font-size:.8rem;font-weight:700">'+totalChanges+' change'+(totalChanges!==1?'s':'')+'</span>'
    +'</div>'
    +'<div style="font-size:.8rem;color:var(--muted);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #f1f5f9">'+esc(c.name)+' · <strong>'+(sv.supType||'overlap')+'</strong> · '+sv.date+' · '+esc(currentUser.name)+'</div>'
    +'<div style="max-height:55vh;overflow-y:auto;padding-right:4px">'+sectionsHtml+'</div>'
    +'<div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap">'
    +'<button class="btn btn-primary" onclick="printSupPDF()">🖨 Print / Download PDF</button>'
    +'<button class="btn btn-outline" onclick="closeModal();clearSupState();render()">Close Without Printing</button>'
    +'<button class="btn btn-outline" onclick="closeModal()">← Back to Editing</button>'
    +'</div></div>');
}

function printSupPDF(){
  const {changes,sv,clientName}=window._supChanges||{};
  if(!changes)return;
  const c=DB.clients.find(x=>x.id===selectedClientId);
  const totalChanges=changes.reduce((a,s)=>a+s.items.length,0);
  const sectionsHtml=changes.map(sec=>{
    const itemsHtml=sec.items.map(it=>{
      let bodyHtml='';
      if(it.html){
        bodyHtml=it.html;
      } else {
        const paras=(it.value||'').split(/\n+/).filter(s=>s.trim());
        bodyHtml=paras.map(p=>'<p style="font-size:.83rem;margin:0 0 5px 0;line-height:1.55">'+esc(p)+'</p>').join('');
      }
      return '<div style="margin-bottom:10px;border:1px solid #e5e7eb;border-radius:6px;overflow:hidden;page-break-inside:avoid">'
        +'<div style="background:#eff6ff;padding:4px 10px;font-size:.76rem;font-weight:700;color:#29ABE2;border-bottom:1px solid #e5e7eb">'+esc(it.label)+'</div>'
        +(bodyHtml?'<div style="padding:7px 10px">'+bodyHtml+'</div>':'')
        +'</div>';
    }).join('');
    return '<div style="margin-bottom:16px;page-break-inside:avoid"><div style="font-size:.78rem;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid #ccc">'+esc(sec.section)+'</div>'+itemsHtml+'</div>';
  }).join('');
  const win=window.open('','_blank');
  win.document.write('<!DOCTYPE html><html><head><title>Supervision — '+clientName+'</title>'
    +'<style>body{font-family:system-ui,sans-serif;padding:30px;max-width:700px;margin:0 auto;color:#1e293b}'
    +'h1{font-size:1.3rem;color:#29ABE2;margin-bottom:4px}'
    +'.meta{font-size:.82rem;color:#64748b;margin-bottom:20px}'
    +'@media print{body{padding:15px}}</style></head><body>'
    +'<h1>Supervision Summary</h1>'
    +'<div class="meta">Client: <strong>'+esc(clientName)+'</strong> &nbsp;|&nbsp; Type: '+(sv.supType||'overlap')+' &nbsp;|&nbsp; Date: '+sv.date+' &nbsp;|&nbsp; Supervisor: '+esc(currentUser.name)+'<br>'+totalChanges+' change'+(totalChanges!==1?'s':'')+' recorded</div>'
    +sectionsHtml
    +'<p style="margin-top:30px;font-size:.75rem;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:10px">Generated by ABA Binder · '+new Date().toLocaleString()+'</p>'
    +'<script>window.onload=()=>window.print();<\/script>'
    +'</body></html>');
  win.document.close();
  // Set TX notification
  if(c){
    c.supNotif={date:sv.date,supType:sv.supType||'overlap',count:totalChanges,by:currentUser.name};
    saveData();
  }
  closeModal();
  clearSupState();
  render();
}

// ── AUTH ──
async function doLogin(){
  const u=document.getElementById('l-user').value.trim();
  const p=document.getElementById('l-pass').value;
  const btn=document.querySelector('#login-screen .btn-primary');
  if(btn){btn.textContent='Loading...';btn.disabled=true;}
  // Load from Supabase first
  const ok=await loadFromSupabase();
  console.log('loadFromSupabase returned:',ok,'users:',DB.users.length);
  if(!ok){
    if(btn){btn.textContent='Log In';btn.disabled=false;}
    document.getElementById('l-err').textContent='Connection error — check internet and try again';
    document.getElementById('l-err').style.display='block';
    return;
  }
  if(!DB.users.length){
    if(btn){btn.textContent='Log In';btn.disabled=false;}
    document.getElementById('l-err').textContent='No users found in database — check Supabase setup';
    document.getElementById('l-err').style.display='block';
    return;
  }
  const user=DB.users.find(x=>x.username===u&&x.password===p);
  console.log('Login attempt — username:',u,'match:',!!user,'all users:',DB.users.map(x=>x.username));
  if(!user){
    if(btn){btn.textContent='Log In';btn.disabled=false;}
    document.getElementById('l-err').textContent='Invalid username or password';
    document.getElementById('l-err').style.display='block';
    return;
  }
  if(user.active===false){
    if(btn){btn.textContent='Log In';btn.disabled=false;}
    document.getElementById('l-err').textContent='This account has been deactivated. Contact your administrator.';
    document.getElementById('l-err').style.display='block';
    return;
  }
  currentUser=user;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('nav').style.display='flex';
  document.getElementById('nav-user').textContent=user.name+' ('+user.role+')';
  document.getElementById('btn-admin').style.display=['director','admin'].includes(user.role)?'':'none';
  document.getElementById('btn-clients').style.display=user.role==='admin'?'none':'';
  document.getElementById('app').style.display='block';
  showView(user.role==='admin'?'admin':'clients');
}
function doLogout(){
  currentUser=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('nav').style.display='none';
  document.getElementById('app').style.display='none';
  // Reset login form
  const lu=document.getElementById('l-user');if(lu)lu.value='';
  const lp=document.getElementById('l-pass');if(lp)lp.value='';
  const le=document.getElementById('l-err');if(le)le.style.display='none';
  const btn=document.querySelector('#login-screen .btn-primary');
  if(btn){btn.textContent='Log In';btn.disabled=false;}
  hideSyncStatus();
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('login-screen').style.display!=='none')doLogin();});

// ── ROUTING ──
function showView(v){currentView=v;render();}
function selectClient(id){
  if(currentUser&&currentUser.role==='admin'){toast('Admin cannot access client sessions');return;}
  if(currentUser&&['junior','senior','therapist'].includes(currentUser.role)&&!(currentUser.assignedClients||[]).includes(id)){toast('⚠ Not assigned to this client');return;}
selectedClientId=id;selectedTab='checklist';showView('client');}
function setTab(t){selectedTab=t;render();}
function render(){
  const app=document.getElementById('app');
  if(currentView==='clients')app.innerHTML=(currentUser&&currentUser.role==='admin')?renderAdmin():renderClientList();
  else if(currentView==='client')app.innerHTML=renderClientView();
  else if(currentView==='admin')app.innerHTML=renderAdmin();
  // Draw lesson charts AFTER innerHTML is set — must happen here not inside renderLessonsView
  if(currentView==='client'&&selectedTab==='lessons'){
    const lessons=DB.lessons.filter(l=>l.clientId===selectedClientId);
    // Initial draw (open cards only, collapsed cards get drawn on open)
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      lessons.forEach(l=>l.sds.forEach(sd=>sd.targets.forEach(t=>drawLessonChart(l,sd,t))));
      // Redraw when a collapsed card is opened
      document.querySelectorAll('details.lesson-card').forEach(det=>{
        det.addEventListener('toggle',function(){
          if(this.open){
            const l2=DB.lessons.find(x=>x.id===this.dataset.lid);
            if(l2)requestAnimationFrame(()=>l2.sds.forEach(sd=>sd.targets.forEach(t=>drawLessonChart(l2,sd,t))));
          }
        },{once:false});
      });
      document.querySelectorAll('details.mastered-target-detail').forEach(det=>{
        det.addEventListener('toggle',function(){
          if(this.open){
            const key=this.dataset.mdet;if(!key)return;
            const [lId,sdId,tId]=key.split('|');
            const l2=DB.lessons.find(x=>x.id===lId);if(!l2)return;
            const sd2=l2.sds.find(x=>x.id===sdId);if(!sd2)return;
            const t2=sd2.targets.find(x=>x.id===tId);
            if(t2)requestAnimationFrame(()=>drawLessonChart(l2,sd2,t2));
          }
        },{once:false});
      });
      // BIP card toggle — draw charts when opened
      document.querySelectorAll('details.card[id^="bip_"]').forEach(det=>{
        det.addEventListener('toggle',function(){
          if(this.open){
            const bipId=this.id.replace('bip_','');
            const bip=(DB.bips||[]).find(b=>b.id===bipId);
            if(bip)requestAnimationFrame(()=>drawBIPChart(bip));
          }
        },{once:false});
      });
    }));
  }
  // Draw BIP charts after innerHTML is set
  if(currentView==='client'&&(selectedTab==='behavior'||selectedTab==='report')){
    const bips=(DB.bips||[]).filter(b=>b.clientId===selectedClientId);
    requestAnimationFrame(()=>requestAnimationFrame(()=>bips.forEach(bip=>drawBIPChart(bip))));
  }

}

// ── CLIENT LIST ──
function renderClientList(){
  const visibleClients=currentUser&&['junior','senior','therapist'].includes(currentUser.role)
    ?DB.clients.filter(c=>(currentUser.assignedClients||[]).includes(c.id))
    :DB.clients;
  if(currentUser&&['junior','senior','therapist'].includes(currentUser.role)&&visibleClients.length===0){
    return '<div style="padding:40px;text-align:center"><h2 style="color:var(--muted);font-size:1.1rem">No clients assigned yet.</h2><p style="color:var(--muted);margin-top:8px">Ask your supervisor to assign you to a client in Admin settings.</p></div>';
  }
  const cards=visibleClients.map(c=>{
    const n=DB.lessons.filter(l=>l.clientId===c.id).length;
    const last=DB.sessions.filter(s=>s.clientId===c.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    const flags=countFlags(c.id);
    return '<div class="client-card" onclick="selectClient(\''+c.id+'\')"><h3 style="font-size:1rem;font-weight:600">'+esc(c.name)+'</h3><p style="font-size:.82rem;color:var(--muted);margin-top:4px">'+esc(c.diagnosis)+' &nbsp;|&nbsp; DOB: '+c.dob+'</p><p style="margin-top:8px;font-size:.82rem">'+n+' lessons &nbsp;'+(flags?'<span class="badge badge-yellow">⚑ '+flags+' flag'+(flags>1?'s':'')+'</span>':'<span class="badge badge-gray">'+(last?'Last: '+last.date:'No sessions')+'</span>')+'</p></div>';
  }).join('');
  const addBtn=['supervisor','director'].includes(currentUser.role)?'<button class="btn btn-primary btn-sm no-print" onclick="showAddClient()">+ Add Client</button>':'';
  return '<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><h2 style="flex:1;font-size:1.3rem">Clients</h2>'+addBtn+'</div><div class="card-grid">'+cards+'</div><div id="modal-area"></div>';
}
function countFlags(cid){return DB.lessons.filter(l=>l.clientId===cid).reduce((s,l)=>s+l.sds.reduce((s2,sd)=>s2+sd.targets.filter(t=>t.status==='flagged').length,0),0);}
function showAddClient(){modal('<h3 style="margin-bottom:14px">Add Client</h3><label>Name<input id="nc-n" type="text"></label><label style="margin-top:10px">DOB<input id="nc-d" type="date"></label><label style="margin-top:10px">Diagnosis<input id="nc-dx" type="text" value="ASD"></label><div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-primary" onclick="addNewClient()">Save</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button></div>');}
function addNewClient(){const name=document.getElementById('nc-n').value.trim();if(!name)return;const nc={id:uid(),name,dob:document.getElementById('nc-d').value,diagnosis:document.getElementById('nc-dx').value,supervisor:currentUser.id,notes:[],reinforcers:[]};DB.clients.push(nc);sbSaveClient(nc);render();}

    if(!sv2.started){
      supBar='<div id="sess-sticky" class="ss-idle">'
        +'<span class="ss-label">⚠ SUPERVISION NOT STARTED</span>'
        +'<span class="ss-val">'+esc(c.name)+'</span>'
        +'<span style="color:#fca5a5;font-size:.78rem">|</span>'
        +'<span class="ss-label">Date</span><input type="date" id="sv-date" value="'+sv2.date+'" onchange="updateSupState(\'date\',this.value)" style="width:130px">'
        +'<span class="ss-label">Type</span><select id="sv-type" onchange="updateSupState(\'supType\',this.value)">'+supTypeOpts+'</select>'
        +'<div style="flex:1"></div>'
        +'<button style="background:#16a34a;color:#fff;border:none;padding:6px 16px;border-radius:7px;font-weight:700;font-size:.83rem;cursor:pointer" onclick="startSupervision()">▶ Start Supervision</button>'
        +'</div>';
    } else {
      const supTypeLabel=(sv2.supType||'overlap').charAt(0).toUpperCase()+(sv2.supType||'overlap').slice(1);
      supBar='<div id="sess-sticky" class="ss-active">'
        +'<span class="ss-label">✅ SUPERVISION IN PROGRESS</span>'
        +'<span class="ss-val">'+esc(c.name)+'</span>'
        +'<span style="background:#16a34a22;color:#15803d;border-radius:4px;padding:1px 8px;font-size:.75rem;font-weight:700">'+supTypeLabel+'</span>'
        +'<span style="color:#86efac;font-size:.78rem">|</span>'
        +'<span class="ss-label">'+sv2.date+'</span>'
        +'<div style="flex:1"></div>'
        +'<button class="btn btn-primary btn-sm" onclick="finishSupervision()">📄 Finish &amp; Preview</button>'
        +'<button class="btn btn-outline btn-sm" onclick="cancelSupervision()">✕ Cancel</button>'
        +'</div>';
    }
    stickyBar=supBar;
  }
  // TX notification badge
  const txNotif=(c.supNotif&&!isSup)?'<div class="alert" style="background:#eff6ff;border:1p'+'x solid #b3e0f5;color:#1a7fad;margin-bottom:8px;display:flex;align-items:center;gap:10px">🔔 <strong>Supervisor updated this client on '+esc(c.supNotif.date)+'</strong> ('+esc(c.supNotif.supType)+') — '+c.supNotif.count+' change'+(c.supNotif.count!==1?'s':'')+' made. <button class="btn btn-xs btn-outline no-print" style="margin-left:auto" onclick="dismissSupNotif()">Dismiss</button></div>':'';
  return stickyBar+'<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><button class="btn btn-outline btn-sm no-print" onclick="showView(\'clients\')">← Clients</button><h2 style="flex:1;font-size:1.2rem">'+esc(c.name)+'</h2><span class="badge badge-gray">'+esc(c.diagnosis)+'</span></div>'+flagBanner+txNotif+'<div class="tabs">'+tabHtml+'</div>'+'<div style="display:flex;align-items:center;gap:8px;padding:6px 16px 2px;flex-wrap:wrap">'+'<span style="font-size:.75rem;color:var(--muted)">Graph month:</span>'+'<input type="month" class="unlock-exempt" style="padding:3px 7px;border:1px solid var(--border);border-radius:6px;font-size:.8rem" value="'+graphMonth+'" onchange="graphMonth=this.value;render()">'+'<button class="btn btn-sm '+(graphMonth===''?'btn-primary':'btn-outline')+' unlock-exempt" onclick="graphMonth=\'\';render()">All</button>'+'</div>'+'<div id="tab-content"'+(isViewOnly()?' class="view-only-mode"':isSessionActive()?'':' class="session-locked"')+'><div class="view-only-banner">👁️ View only — not assigned to this client / admin</div><div class="no-session-banner">👁 View only — start a session to record data</div>'+renderTab()+'</div><div id="modal-area"></div>';
}
function isViewOnly(){
  if(!currentUser||!selectedClientId)return false;
  if(currentUser.role==='admin')return true;
  if(currentUser.role!=='supervisor')return false;
  const ac=currentUser.assignedClients||[];
  return !ac.includes(selectedClientId);
}
function isSessionActive(){
  if(!currentUser)return false;
  const isSup=['supervisor','director'].includes(currentUser.role);
  return isSup?!!getSupState().started:!!getSessState().started;
}
function renderTab(){
  if(selectedTab==='session')return renderSessionEntry();
  if(selectedTab==='checklist')return renderProgramChecklist();
  if(selectedTab==='lessons')return renderLessonsView();
  if(selectedTab==='maintenance')return renderMaintenanceTab();
  if(selectedTab==='behavior')return renderBehaviorTab();
  if(selectedTab==='abc')return renderABCTab();
  if(selectedTab==='notes')return renderNotesTab();
  if(selectedTab==='report')return renderReport();
  return '';
}
function renderSupLocked(tabName){
  return '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;gap:16px">'
    +'<div style="font-size:3rem">🔒</div>'
    +'<h3 style="margin:0;color:var(--muted)">'+tabName+' is locked</h3>'
    +'<p style="color:var(--muted);font-size:.9rem;text-align:center;max-width:320px">Start a supervision session from the Checklist tab to unlock editing.</p>'
    +'<button class="btn btn-primary" onclick="selectedTab=\'checklist\';render()">Go to Checklist</button>'
    +'</div>';
}

function renderSessionEntry(){
  const ss_check=getSessState();

  const today=new Date().toISOString().slice(0,10);
  const lessons=DB.lessons.filter(l=>l.clientId===selectedClientId);
  const active=lessons.filter(l=>l.phase!=='maintenance'&&l.phase!=='hold');
  const maint=lessons.filter(l=>l.phase==='maintenance');
  const held=lessons.filter(l=>l.phase==='hold');
  const blocks=active.map(l=>renderLessonSessionBlock(l)).join('');
  const maintBlock=maint.length?'<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><h2 style="flex:1;margin:0">🔁 Maintenance Lessons</h2><span style="font-size:.8rem;color:var(--muted)">Check each mastered target with +, P, or −</span></div>'+maint.map(l=>renderMaintenanceEntry(l)).join('')+'</div>':'';
  const heldBanner=held.length?'<div class="alert" style="background:#fef3c7;color:#92400e;border:1px solid #fcd34d;margin-bottom:10px">⏸ '+held.length+' lesson'+(held.length>1?'s are':' is')+' on hold (not shown)</div>':'';
  const txNotesCard='<div class="card" style="margin-top:14px">'
    +'<h2 style="margin-bottom:8px">📝 Session Notes</h2>'
    +'<p style="font-size:.78rem;color:var(--muted);margin-bottom:8px">Record anything significant from this session — behavior observations, client mood, parent communication, environment notes, etc. <strong>Tip:</strong> Type as you go — notes are kept until you End Session.</p>'
    +'<textarea id="tx-sess-notes" rows="4" placeholder="e.g. Client was distracted first 30 min, picked up pace after break. Mom mentioned no sleep last night. Tantrum at 2:15pm, resolved in ~3 min with extinction..." style="font-size:.84rem"></textarea>'
    +'</div>';
  return heldBanner+(blocks||'<div class="empty-state">No active lessons.</div>')+maintBlock+txNotesCard;
}

function renderLessonSessionBlock(lesson){
  const supNote=lesson.supNotes&&lesson.supNotes.length?lesson.supNotes[lesson.supNotes.length-1]:null;
  const styleBadge='<span class="badge badge-gray">'+lesson.teachingStyle+'</span>';
  const phaseBadge='<span class="badge badge-'+(lesson.phase==='acquisition'?'blue':lesson.phase==='dt'?'purple':'green')+'">'+lesson.phase+'</span>';
  let body='';
  if(supNote)body+='<div class="alert alert-info" style="margin-bottom:10px"><strong>Sup note ('+supNote.date+'):</strong> '+esc(supNote.text)+'</div>';

  if(lesson.phase==='acquisition'){
    lesson.sds.forEach((sd,si)=>{
      const activeTargets=sd.targets.filter(t=>t.status!=='mastered');
      const sessHasMastered=sd.targets.some(t=>t.status==='mastered');
      const sessHasHeld=sd.targets.some(t=>t.status==='on_hold');
      if(!activeTargets.length&&!sessHasMastered&&!sessHasHeld)return;
      const sdTsBadge=sd.teachingStyle?'<span class="badge badge-gray" style="font-size:.7rem">'+esc(sd.teachingStyle)+'</span>':'';
      body+='<div class="sd-block"><div class="sd-header"><h4>SD'+(si+1)+': '+esc(sd.sd)+'</h4>'+sdTsBadge+'</div><div class="sd-body"><p style="font-size:.8rem;color:var(--muted);margin-bottom:10px"><em>R: '+esc(sd.response)+'</em></p>';
      activeTargets.forEach(t=>{ body+=renderTargetSessionEntry(lesson,sd,t); });
      body+=renderHoldSection(lesson,sd,false);
      body+=renderMasteredSection(lesson,sd,si,false);
      body+='</div></div>';
    });
  } else if(lesson.phase==='dt'){
    body+=renderDTSessionEntry(lesson);
  }

  // general note for lesson
  body+='<div style="margin-top:10px"><label>Lesson note (optional)</label><input type="text" id="lnote_'+lesson.id+'" placeholder="Overall note for this lesson..."></div>';
  return '<details class="lesson-card" style="margin-bottom:10px"><summary style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px 14px;list-style:none;user-select:none"><span style="font-size:1.1rem;margin-right:4px">▶</span><h3 style="flex:1;margin:0">'+esc(lesson.name)+'</h3>'+styleBadge+' '+phaseBadge+'</summary><div class="lesson-body" style="padding:12px 14px">'+body+'</div></details>';
}

// ── Target session entry ──
function renderTargetSessionEntry(lesson,sd,target){
  const id=lesson.id+'_'+sd.id+'_'+target.id;
  const graphId='sg_'+id;
  // build mini graph data
  let html='<div class="target-block">';
  html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
  html+='<strong style="flex:1;font-size:.88rem">🎯 '+esc(target.name)+'</strong>';
  html+='<label style="display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);cursor:pointer"><input type="checkbox" id="na_'+id+'" onchange="toggleNA(\''+id+'\')"> N/A</label>';
  if(target.dataType==='ta'&&target.chainingMode&&target.chainingMode!=='total'){
    const ci=getCurrentStepIndex(target);
    html+='<span style="font-size:.78rem;background:#fffbeb;color:#92400e;padding:2px 8px;border-radius:4px">📍 Step '+(ci+1)+'/'+target.taSteps.length+'</span>';
  }
  if(target.teachingSteps&&target.teachingSteps.length){
    const curStep=target.teachingSteps[target.dtStepIndex||0]||target.teachingSteps[0];
    html+='<span style="font-size:.75rem;background:#e8f6fd;color:#1a7fad;padding:2px 8px;border-radius:4px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(curStep)+'">📋 '+esc(curStep)+'</span>';
  }
  html+='<span class="target-status status-'+target.status+'">'+target.status.replace(/_/g,' ')+'</span>';
  html+='<button class="btn btn-xs btn-outline no-print" onclick="toggleSessionGraph(\''+graphId+'\',\''+lesson.id+'\',\''+sd.id+'\',\''+target.id+'\')">📊 Graph</button>';
  html+='</div>';

  // expandable graph
  html+='<div id="'+graphId+'" class="session-graph-wrap hidden"><div class="chart-wrap" style="height:150px"><canvas id="c_'+graphId+'"></canvas></div></div>';

  // data entry
  if(target.dataType==='percent'){
    html+='<div class="form-row" style="margin-bottom:0"><div class="fg-sm"><label>Correct</label><input type="number" id="cor_'+id+'" min="0" placeholder="0" style="width:70px" oninput="calcPct(\''+id+'\')"></div><div class="fg-sm"><label>Total trials</label><input type="number" id="tot_'+id+'" min="5" value="'+target.trialCount+'" style="width:70px" oninput="calcPct(\''+id+'\')"></div><div style="display:flex;align-items:flex-end;padding-bottom:9px"><span id="pctlbl_'+id+'" style="font-size:1rem;font-weight:700;color:var(--primary);min-width:50px"></span></div></div>';

  } else if(target.dataType==='ta'){
    const mode=target.chainingMode||'total';
    const teachIdx=getCurrentStepIndex(target);
    html+=target.taSteps.map((s,i)=>{
      const isMastered=isStepMastered(target,i);
      const isTeach=mode!=='total'&&i===teachIdx&&!isMastered;
      const bg=isTeach?'background:#fffbeb;border-radius:6px;padding:4px 2px;':'';
      const teachLabel=isTeach?'<span style="font-size:.72rem;color:#d97706;font-weight:700;margin-left:4px">← TEACH</span>':'';
      const mastLabel=isMastered?'<span style="font-size:.72rem;color:#16a34a;margin-left:4px">✓</span>':'';
      let ctrl='';
      if(isMastered){ctrl='<span style="font-size:.78rem;color:#16a34a">✓ mastered</span>';}
      else{ctrl='<div class="cpi-group"><button class="cpi-btn plus" data-id="ta_'+id+'_'+i+'" onclick="toggleCPI(this)">+</button><button class="cpi-btn P" data-id="ta_'+id+'_'+i+'" onclick="toggleCPI(this)">P</button><button class="cpi-btn minus" data-id="ta_'+id+'_'+i+'" onclick="toggleCPI(this)">−</button></div>';}
      return '<div class="ta-row" style="'+bg+'"><span style="font-size:.83rem"><b>'+(i+1)+'.</b> '+esc(s)+teachLabel+mastLabel+'</span>'+ctrl+'</div>';
    }).join('');

  } else if(target.dataType==='rating'){
    const rs=target.ratingScale||{min:1,max:5,labels:{}};
    html+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">';
    for(let v=rs.min;v<=rs.max;v++){
      const lbl=rs.labels&&rs.labels[v]?rs.labels[v]:'';
      html+='<button class="cpi-btn" style="width:auto;padding:4px 10px;height:auto;line-height:1.4;font-size:.8rem;text-align:center" data-id="rt_'+id+'" data-val="'+v+'" onclick="toggleRating(this)"><strong>'+v+'</strong>'+(lbl?'<br><span style="font-size:.7rem;font-weight:400">'+esc(lbl)+'</span>':'')+'</button>';
    }
    html+='</div>';
  } else if(target.dataType==='tally'){
    const goalTxt=target.tallyGoal?(` — goal: ${target.tallyGoal}`+(target.tallyPeriod?` per ${target.tallyPeriod} min`:'')):''
    html+='<div style="margin-top:6px">';
    html+='<label style="font-size:.82rem;color:var(--muted)">Count observed'+goalTxt+'</label>';
    html+='<div style="display:flex;align-items:center;gap:8px;margin-top:4px">';
    html+='<button class="cpi-btn minus" style="font-size:1.2rem;width:36px;height:36px" onclick="adjustTally(\'dec_'+id+'\',\'tally_'+id+'\')">−</button>';
    html+='<input type="number" id="tally_'+id+'" min="0" value="0" style="width:70px;font-size:1.3rem;font-weight:700;text-align:center;border:2px solid var(--primary);border-radius:8px;padding:4px">';
    html+='<button class="cpi-btn plus" style="font-size:1.2rem;width:36px;height:36px" onclick="adjustTally(\'inc_'+id+'\',\'tally_'+id+'\')">\+</button>';
    html+='</div></div>';
  }

  html+='</div>';

  return html;
}

function calcPct(id){
  const cor=parseFloat(document.getElementById('cor_'+id)&&document.getElementById('cor_'+id).value)||0;
  const tot=parseFloat(document.getElementById('tot_'+id)&&document.getElementById('tot_'+id).value)||0;
  const el=document.getElementById('pctlbl_'+id);
  if(el&&tot>0)el.textContent=Math.round(cor/tot*100)+'%';
}

const _graphDrawn={};
function toggleNA(id){
  const cb=document.getElementById('na_'+id);
  const block=cb&&cb.closest('.target-block');
  if(!block)return;
  const inputs=block.querySelectorAll('input:not([type=checkbox]),button.cpi-btn,textarea,select');
  inputs.forEach(el=>{el.disabled=cb.checked;el.style.opacity=cb.checked?'0.35':'1';});
  if(cb.checked){block.style.opacity='0.55';}else{block.style.opacity='1';}
}
function toggleSessionGraph(graphId,lessonId,sdId,targetId){
  const el=document.getElementById(graphId);
  if(!el)return;
  const isHidden=el.classList.contains('hidden');
  el.classList.toggle('hidden',!isHidden);
  el.classList.toggle('visible',isHidden);
  // draw chart first time it opens
  if(isHidden&&!_graphDrawn[graphId]){
    _graphDrawn[graphId]=true;
    const lesson=DB.lessons.find(l=>l.id===lessonId);
    if(!lesson)return;
    const sd=lesson.sds.find(s=>s.id===sdId);
    if(!sd)return;
    const target=sd.targets.find(t=>t.id===targetId);
    if(!target)return;
    setTimeout(()=>drawSessionGraph(lesson,sd,target,'c_'+graphId),120);
  }
}

function drawSessionGraph(lesson,sd,target,canvasId){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  const existingSess=Chart.getChart(canvas);if(existingSess)existingSess.destroy();
  const sessions=DB.sessions.filter(s=>s.clientId===selectedClientId&&(!graphMonth||s.date.slice(0,7)===graphMonth)).sort((a,b)=>a.date.localeCompare(b.date));
  const labels=[],vals=[],rawDates=[];
  sessions.forEach(s=>{
    s.lessonData&&s.lessonData.forEach(ld=>{
      if(ld.lessonId!==lesson.id)return;
      ld.targets&&ld.targets.forEach(t=>{
        if(t.targetId!==target.id)return;
        const v=t.pct!=null?t.pct:(t.rating!=null?t.rating:(t.count!=null?(t.count/(s.sessTime||2)):null));
        if(v!=null&&!t.na){labels.push(fmtDateShort(s.date)+'\n'+s.txName.split(' ')[0]);vals.push(v);rawDates.push(s.date);}
      });
    });
  });
  if(!labels.length)return;
  const isRating=target.dataType==='rating';
  const isTally=target.dataType==='tally';
  const maxY=isRating?(target.ratingScale&&target.ratingScale.max||5):isTally?Math.max(10,...(vals.length?vals:[10]))*1.2:100;
  const masteryLine=isRating?(target.ratingScale&&target.ratingScale.max||5):isTally?(target.tallyGoal||null):lesson.masteryRule.pct||80;
  // phase change lines
  const sgStepChanges=(target.dtStepChanges||[]).filter(c=>c.date);
  const sgPhaseLines=sgStepChanges.map(c=>{
    if(rawDates.length===0)return null;
    const sgSteps=target.teachingSteps||[];
    if(c.sessionCount!=null){
      const sgPinIdx=Math.min(c.sessionCount,rawDates.length-1);
      return{idx:sgPinIdx,label:'Step '+(c.to+1)+': '+(sgSteps[c.to]||'')};
    }
    const sgAfterIdx=rawDates.findIndex(d=>d>c.date);
    if(sgAfterIdx>=0)return{idx:sgAfterIdx,label:'Step '+(c.to+1)+': '+(sgSteps[c.to]||'')};
    return{idx:rawDates.length-1,label:'Step '+(c.to+1)+': '+(sgSteps[c.to]||'')};
  }).filter(Boolean);
  const sgPhasePlugin={id:'sgPhaseLines',afterDraw(chart){
    if(!sgPhaseLines.length)return;
    const ctx2=chart.ctx,xAxis=chart.scales.x,yAxis=chart.scales.y;
    sgPhaseLines.forEach(pl=>{
      if(pl.idx>=xAxis.ticks.length)return;
      const x=xAxis.getPixelForTick(pl.idx);
      ctx2.save();
      ctx2.strokeStyle='#f59e0b';ctx2.lineWidth=2;ctx2.setLineDash([5,3]);
      ctx2.beginPath();ctx2.moveTo(x,yAxis.top);ctx2.lineTo(x,yAxis.bottom);ctx2.stroke();
      ctx2.setLineDash([]);
      ctx2.font='bold 8px sans-serif';
      const tag=pl.label.length>16?pl.label.slice(0,15)+'…':pl.label;
      const tw=ctx2.measureText(tag).width+8;
      const tx=x-tw/2,ty=yAxis.bottom+16;
      ctx2.fillStyle='#f59e0b';
      ctx2.beginPath();ctx2.rect(tx,ty,tw,14);ctx2.fill();
      ctx2.fillStyle='#78350f';ctx2.textAlign='center';
      ctx2.fillText(tag,x,ty+10);
      ctx2.restore();
    });
  }};
  new Chart(canvas,{type:'line',data:{labels,datasets:[
    {label:'Score',data:vals,borderColor:'#29ABE2',backgroundColor:'rgba(41,171,226,.1)',tension:.3,fill:true,pointRadius:5,pointHoverRadius:7},
    {label:'Mastery',data:labels.map(()=>masteryLine),borderColor:'#16a34a',borderDash:[4,4],pointRadius:0,fill:false}
  ]},plugins:[sgPhasePlugin],options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:18}},plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>isRating?'Rating: '+ctx.parsed.y:ctx.parsed.y+'%'}}},scales:{y:{beginAtZero:true,min:0,max:maxY,ticks:{stepSize:isRating?1:isTally?1:10,callback:v=>isRating?v:isTally?v:''+v+'%'},title:{display:true,text:isRating?'Rating':isTally?'Rate/hr':'% Correct',font:{size:10}}},x:{ticks:{font:{size:9},maxRotation:45,minRotation:30},title:{display:false}}}}});
}

// ── DT Session Entry ──
function renderDTSessionEntry(lesson){
  const dtSteps=lesson.teachingStyle==='DTT'?(lesson.dtType==='successive'?DT_SUCCESSIVE:DT_SIMULTANEOUS):[];
  if(!dtSteps.length)return'<p style="color:var(--muted);font-size:.87rem">DT phase active.</p>';
  const currentIdx=lesson.dtStepIndex||0;
  let html='<div class="phase-banner phase-dt">🔀 DT Phase — '+lesson.dtType.toUpperCase()+' &nbsp;|&nbsp; Step '+(currentIdx+1)+'/'+dtSteps.length+': <strong>'+dtSteps[currentIdx]+'</strong></div>';
  const id='dt_'+lesson.id;
  html+='<div class="dt-step-row active-dt">';
  html+='<p style="font-weight:600;font-size:.9rem;margin-bottom:10px">'+dtSteps[currentIdx]+'</p>';

// ── Chaining helpers ──
function getCurrentStepIndex(target){
  if(!target.chainingMode||target.chainingMode==='total')return -1;
  const steps=target.taSteps||[];
  if(target.chainingMode==='forward'){for(let i=0;i<steps.length;i++){if(!isStepMastered(target,i))return i;}return steps.length-1;}
  else{for(let i=steps.length-1;i>=0;i--){if(!isStepMastered(target,i))return i;}return 0;}
}
function isStepMastered(target,stepIdx){
  // Rule: 2 consecutive sessions with '+', across 2 different therapists
  const arr=(target.stepMasteryRecords||{})[stepIdx]||[];
  if(arr.length<2)return false;
  // Find the last 2 consecutive '+' entries; a '-' resets the streak
  let streak=[];
  for(let i=arr.length-1;i>=0;i--){
    if(arr[i].result==='+')streak.unshift(arr[i]);
    else break; // '-' breaks streak going backwards
  }
  if(streak.length<2)return false;
  // last 2 in streak must be from 2 different therapists
  const last2=streak.slice(-2);
  return last2[0].txId!==last2[1].txId;
}

// ── SAVE SESSION ──
function saveSession(){
  const ssEl=document.getElementById('ss-date');
  const stEl=document.getElementById('ss-time');
  const ss3=getSessState();
  const date=(ssEl&&ssEl.value)||ss3.date||new Date().toISOString().slice(0,10);
  const sessTime=stEl?parseFloat(stEl.value)||4:(ss3.sessTime||4);
  const lessons=DB.lessons.filter(l=>l.clientId===selectedClientId);
  const lessonData=[];

  lessons.forEach(lesson=>{
    const ld={lessonId:lesson.id,lessonName:lesson.name,targets:[]};
    const lnote=(document.getElementById('lnote_'+lesson.id)||{}).value||'';
    ld.note=lnote;

    if(lesson.phase==='acquisition'){
      lesson.sds.forEach(sd=>{
        sd.targets.filter(t=>t.status!=='mastered').forEach(target=>{
          const id=lesson.id+'_'+sd.id+'_'+target.id;
          const entry={targetId:target.id,targetName:target.name,sdId:sd.id,dataType:target.dataType};

          if(target.dataType==='percent'){
            const corEl=document.getElementById('cor_'+id);
            const totEl=document.getElementById('tot_'+id);
            // Only record if Tx explicitly typed in the correct field (non-empty)
            const corTyped=corEl&&corEl.value.trim()!=='';
            if(corTyped){
              const cor=parseInt(corEl.value)||0;
              const tot=parseInt((totEl||{}).value)||target.trialCount;
              entry.correct=cor;entry.total=tot;entry.pct=Math.round(cor/tot*100);
            } else {entry._skipped=true;}
          } else if(target.dataType==='rating'){
            const sel=document.querySelector('.cpi-btn[data-id="rt_'+id+'"].rating-sel');
            if(sel){entry.rating=parseInt(sel.dataset.val);entry.pct=Math.round((entry.rating-1)/((target.ratingScale&&target.ratingScale.max||5)-1)*100);}
          } else if(target.dataType==='ta'){
            const mode=target.chainingMode||'total';
            const teachIdx=getCurrentStepIndex(target);
            entry.chainingMode=mode;entry.teachIdx=teachIdx;
            entry.steps=target.taSteps.map((s,i)=>{
              const isMastered=isStepMastered(target,i);
              if(isMastered)return{step:s,stepIdx:i,mastered:true};
              const sel=document.querySelector('.cpi-btn[data-id="ta_'+id+'_'+i+'"].sel');
              const res=sel?(sel.classList.contains('plus')?'+':sel.classList.contains('minus')?'-':'P'):'';
              return{step:s,stepIdx:i,result:res,isTeaching:mode!=='total'&&i===teachIdx};
            });
            // percent = C steps / total — only record if at least one step was scored
            const cCount=entry.steps.filter(x=>x.result==='+').length;
            const anyScored=entry.steps.some(x=>x.result!=='');
            if(anyScored&&target.taSteps.length>0)entry.pct=Math.round(cCount/target.taSteps.length*100);
            else entry._skipped=true;
            // update chaining records
            if(mode!=='total'&&teachIdx>=0){
              const teachRes=entry.steps[teachIdx]&&entry.steps[teachIdx].result;
              if(teachRes==='+'){
                if(!target.stepMasteryRecords)target.stepMasteryRecords={};
                if(!target.stepMasteryRecords[teachIdx])target.stepMasteryRecords[teachIdx]=[];
                target.stepMasteryRecords[teachIdx].push({txId:currentUser.id,date,result:'+'});
                if(isStepMastered(target,teachIdx)){
                  const allDone=target.taSteps.every((_,i)=>isStepMastered(target,i));
                  if(allDone)target.status='flagged';
                }
              }
            }
          } else if(target.dataType==='tally'){
            const tallyEl=document.getElementById('tally_'+id);
            const tallyVal=tallyEl?parseInt(tallyEl.value):NaN;
            if(!isNaN(tallyVal)){entry.count=tallyVal;entry.pct=null;}
            else{entry._skipped=true;}
          }
          const naEl=document.getElementById('na_'+id);
          if(naEl&&naEl.checked){
            ld.targets.push({targetId:target.id,targetName:target.name,sdId:sd.id,dataType:target.dataType,na:true});
          } else if(!entry._skipped){
            ld.targets.push(entry);
            // check mastery for percent/rating
            if(entry.pct!=null)checkMastery(lesson,target,date,entry.pct);
          }
        });
        // maintenance checklist
        sd.targets.filter(t=>t.status==='mastered').forEach(target=>{
          const sel=document.querySelector('.cpi-btn[data-id="mc_'+lesson.id+'_'+target.id+'"].sel');
          if(sel)ld.targets.push({targetId:target.id,targetName:target.name,sdId:sd.id,dataType:'maintenance',result:sel.classList.contains('plus')?'+':sel.classList.contains('minus')?'-':'P'});
        });
      });
    } else if(lesson.phase==='dt'){
      const dtId='dt_'+lesson.id;
      const ftSel=document.querySelector('.cpi-btn[data-id="dtft_'+dtId+'"].sel');
      const cor=parseInt((document.getElementById('dtcor_'+dtId)||{}).value)||0;
      const tot=parseInt((document.getElementById('dttot_'+dtId)||{}).value)||0;
      const pct=tot>0?Math.round(cor/tot*100):null;
      const ftResult=ftSel?(ftSel.classList.contains('plus')?'+':'-'):null;
      if(ftResult||pct!=null){
        ld.dtData={stepIndex:lesson.dtStepIndex,stepName:(lesson.dtType==='successive'?DT_SUCCESSIVE:DT_SIMULTANEOUS)[lesson.dtStepIndex||0],firstTrial:ftResult,correct:cor,total:tot,pct};
        // check DT step advancement: 80% first trial unprompted x2 consecutive x2 Tx
        checkDTStepAdvance(lesson,date,ftResult,pct);
      }
    }

    if(ld.targets.length||ld.dtData)lessonData.push(ld);
  });

  const txNotes=(document.getElementById('tx-sess-notes')||{}).value||'';
  const ss_save=getSessState();
  const newSess={id:uid(),clientId:selectedClientId,date,txId:currentUser.id,txName:currentUser.name,sessTime,sessType:ss_save.sessType||'overlap',notes:txNotes,lessonData};
  DB.sessions.push(newSess);
  clearSessState();
  // Save session immediately to Supabase
  sbSaveSession(sessionToRow(newSess));
  // Also flush any pending lesson/bip changes
  flushSave();
  // flash checklist checkmarks before re-render
  lessonData.forEach(ld=>{
    (ld.targets||[]).filter(t=>t.dataType!=='maintenance').forEach(t=>{
      const el=document.getElementById('cl_'+ld.lessonId+'_'+t.targetId);
      if(el){el.className='cl-check done';el.textContent='✓';}
    });
  });
  setTimeout(()=>{toast('Session saved ✓ — returning to client list');showView('clients');},800);
}

function checkMastery(lesson,target,date,pct){
  if(target.status==='mastered'||target.status==='flagged')return;
  const rule=lesson.masteryRule||{pct:80,sessions:3,therapists:2};
  const scores=[];
  DB.sessions.filter(s=>s.clientId===selectedClientId).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,rule.sessions*3).forEach(s=>{
    s.lessonData&&s.lessonData.forEach(ld=>{
      if(ld.lessonId!==lesson.id)return;
      ld.targets&&ld.targets.forEach(t=>{if(t.targetId===target.id&&t.pct!=null)scores.push({pct:t.pct,txId:s.txId,date:s.date});});
    });
  });
  scores.unshift({pct,txId:currentUser.id,date});
  if(scores.length>=rule.sessions){
    const recent=scores.slice(0,rule.sessions);
    if(recent.every(x=>x.pct>=rule.pct)&&new Set(recent.map(x=>x.txId)).size>=rule.therapists){
      target.status='flagged';
      // Auto-advance: activate next not_started target in same SD
      const sd=lesson.sds.find(sd=>sd.targets.some(t=>t.id===target.id));
      if(sd){
        const idx=sd.targets.findIndex(t=>t.id===target.id);
        const next=sd.targets.slice(idx+1).find(t=>t.status==='not_started');
        if(next){next.status='in_progress';next.introducedDate=date;toast('✅ '+target.name+' mastered → '+next.name+' now active',4000);}
        else{toast('✅ '+target.name+' mastered! All targets in this SD complete.',3000);}
      }
      saveData();
    }
  }
}

function checkDTStepAdvance(lesson,date,ftResult,pct){
  const stepIdx=lesson.dtStepIndex||0;
  const rule=lesson.masteryRule||{pct:80,sessions:2,therapists:2};
  if(!lesson.dtStepRecords)lesson.dtStepRecords={};
  if(!lesson.dtStepRecords[stepIdx])lesson.dtStepRecords[stepIdx]=[];
  if(ftResult==='+'&&pct!=null&&pct>=rule.pct){
    lesson.dtStepRecords[stepIdx].push({txId:currentUser.id,date,pct});
    const relevant=lesson.dtStepRecords[stepIdx];
    // check 2 consecutive sessions x 2 Tx
    if(relevant.length>=2){
      const last2=relevant.slice(-2);
      const uniqueTx=new Set(last2.map(x=>x.txId)).size;
      if(last2.every(x=>x.pct>=rule.pct)&&uniqueTx>=2){
        const dtSteps=lesson.dtType==='successive'?DT_SUCCESSIVE:DT_SIMULTANEOUS;
        if(stepIdx<dtSteps.length-1){
          lesson.dtStepIndex=stepIdx+1;
          toast('🎉 DT step advanced to: '+dtSteps[stepIdx+1],4000);
        } else {
          lesson.phase='maintenance';
          lesson.maintenanceSchedule='once a week';
          toast('🎉 All DT steps complete! Moved to Maintenance.',4000);
        }
      }
    }
  }
  saveData();
}

function fmtDateShort(d){
  // d = 'YYYY-MM-DD' → 'Jun 6, 26'
  if(!d)return'';
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const parts=d.split('-');if(parts.length<3)return d;
  return months[parseInt(parts[1])-1]+' '+parseInt(parts[2])+', '+parts[0].slice(2);
}
function drawLessonChart(lesson,sd,target){
  const chartId='lch_'+lesson.id+'_'+sd.id+'_'+target.id;
  const wrapEl=document.getElementById('wrap_'+chartId);
  const canvas=document.getElementById(chartId);
  if(!canvas){if(wrapEl)wrapEl.innerHTML='<p style="color:red;font-size:.75rem">ERR: canvas not found</p>';return;}
  // Set explicit pixel dimensions — walk up DOM to find a visible ancestor (details may be collapsed)
  let _w=0;let _el=wrapEl;while(_el&&_w<10){_w=_el.offsetWidth;_el=_el.parentElement;}
  canvas.width=_w||document.getElementById('app').offsetWidth||400;
  canvas.height=140;
  const existing=Chart.getChart(canvas);if(existing)existing.destroy();
  const sessions=DB.sessions.filter(s=>s.clientId===selectedClientId&&(!graphMonth||s.date.slice(0,7)===graphMonth)).sort((a,b)=>a.date.localeCompare(b.date));
  const labels=[],vals=[],sessionDates=[];
  sessions.forEach(s=>{s.lessonData&&s.lessonData.forEach(ld=>{if(ld.lessonId!==lesson.id)return;ld.targets&&ld.targets.forEach(t=>{if(t.targetId!==target.id)return;if(t.na)return;
const v=t.pct!=null?t.pct:(t.rating!=null?t.rating:(t.count!=null?t.count:null));if(v!=null){labels.push(fmtDateShort(s.date)+'\n'+s.txName.split(' ')[0]);sessionDates.push(s.date);vals.push(target.dataType==='rating'?t.rating:v);}});});});
  if(!labels.length){if(wrapEl)wrapEl.innerHTML='<p style="font-size:.78rem;color:var(--muted);padding:8px 0">📊 No session data yet for this target.</p>';return;}
  if(wrapEl)wrapEl.style.border='1px solid #29ABE2';
  const isRating=target.dataType==='rating';
  const isTally=target.dataType==='tally';
  const maxY=isRating?(target.ratingScale&&target.ratingScale.max||5):isTally?Math.max(10,...(vals.length?vals:[10]))*1.2:100;
  const masteryLine=isRating?(target.ratingScale&&target.ratingScale.max||5):isTally?(target.tallyGoal||null):lesson.masteryRule.pct||80;
  // Phase change lines: find indices where dtStepChanges happened
  const stepChanges=(target.dtStepChanges||[]).filter(c=>c.date);
  const phaseLines=stepChanges.map(c=>{
    if(sessionDates.length===0)return null;
    const steps=target.teachingSteps||[];
    // use stored sessionCount pin if available
    if(c.sessionCount!=null){
      const pinIdx=Math.min(c.sessionCount,sessionDates.length-1);
      return{idx:pinIdx,label:'Step '+(c.to+1)+': '+(steps[c.to]||'')};
    }
    // fallback: first session strictly after change date
    const afterIdx=sessionDates.findIndex(d=>d>c.date);
    if(afterIdx>=0)return{idx:afterIdx,label:'Step '+(c.to+1)+': '+(steps[c.to]||'')};
    return{idx:sessionDates.length-1,label:'Step '+(c.to+1)+': '+(steps[c.to]||'')};
  }).filter(Boolean);
  // Custom plugin: draw vertical phase change lines + labels
  const phaseLinePlugin={id:'phaseLines',afterDraw(chart){
    const ctx2=chart.ctx,xAxis=chart.scales.x,yAxis=chart.scales.y;
    phaseLines.forEach(pl=>{
      if(pl.idx>=xAxis.ticks.length)return;
      const x=xAxis.getPixelForTick(pl.idx);
      ctx2.save();
      ctx2.strokeStyle='#f59e0b';ctx2.lineWidth=2;ctx2.setLineDash([5,3]);
      ctx2.beginPath();ctx2.moveTo(x,yAxis.top);ctx2.lineTo(x,yAxis.bottom);ctx2.stroke();
      ctx2.setLineDash([]);
      ctx2.font='bold 8px sans-serif';
      const tag=pl.label.length>16?pl.label.slice(0,15)+'…':pl.label;
      const tw=ctx2.measureText(tag).width+8;
      const tx=x-tw/2,ty=yAxis.bottom+16;
      ctx2.fillStyle='#f59e0b';
      ctx2.beginPath();ctx2.rect(tx,ty,tw,14);ctx2.fill();
      ctx2.fillStyle='#78350f';ctx2.textAlign='center';
      ctx2.fillText(tag,x,ty+10);
      ctx2.restore();
    });
  }};
  new Chart(canvas,{type:'line',data:{labels,datasets:[
    {label:'Score',data:vals,borderColor:'#29ABE2',backgroundColor:'rgba(41,171,226,.1)',tension:.3,fill:true,pointRadius:5,pointHoverRadius:7},
    {label:'Mastery '+masteryLine+(isRating?'':('%')),data:labels.map(()=>masteryLine),borderColor:'#16a34a',borderDash:[4,4],pointRadius:0,borderWidth:1.5,fill:false}
  ]},plugins:[phaseLinePlugin],options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:18}},plugins:{legend:{display:false},tooltip:{callbacks:{title:ctx=>ctx[0].label.replace('\n',' — '),label:ctx=>isRating?'Rating: '+ctx.parsed.y:ctx.parsed.y+'% correct'}}},scales:{y:{beginAtZero:true,min:0,max:maxY,ticks:{stepSize:isRating?1:10,callback:v=>isRating?v:v+'%'},title:{display:true,text:isRating?'Rating':'% Correct',font:{size:10}}},x:{ticks:{font:{size:9},maxRotation:45,minRotation:30},title:{display:false}}}}});
}

// ── Mastery actions ──
function setTargetStatus(lId,sId,tId,status){
  const l=DB.lessons.find(x=>x.id===lId);if(!l)return;
  const sd=l.sds.find(x=>x.id===sId);if(!sd)return;
  const t=sd.targets.find(x=>x.id===tId);if(!t)return;
  const today=new Date().toISOString().slice(0,10);
  if(status==='mastered'){
    t.status='mastered';t.masteredDate=today;
    toast('✓ Target mastered: '+t.name);
  } else if(status==='on_hold'){
    t._prevStatus=t.status;t.status='on_hold';
    toast('⏸ Target on hold: '+t.name);
  } else if(status==='in_progress'){
    t.status='in_progress';
    toast('▶ Target resumed: '+t.name);
  }
  saveData();render();
}
function confirmMastery(lId,sId,tId){
  const l=DB.lessons.find(x=>x.id===lId),sd=l.sds.find(x=>x.id===sId),t=sd.targets.find(x=>x.id===tId);
  t.status='mastered';t.masteredDate=new Date().toISOString().slice(0,10);
  const allMastered=l.sds.every(s=>s.targets.every(x=>x.status==='mastered'));
  saveData();toast(allMastered?'🎉 All targets mastered! Consider advancing phase.':'✓ Target mastered',allMastered?4000:2500);render();
}
function rejectMastery(lId,sId,tId){const l=DB.lessons.find(x=>x.id===lId),sd=l.sds.find(x=>x.id===sId),t=sd.targets.find(x=>x.id===tId);t.status='in_progress';saveData();toast('Kept as in-progress');render();}
function setLessonStatus(lId,status){
  const l=DB.lessons.find(x=>x.id===lId);if(!l)return;
  if(status==='maintenance'&&l.phase!=='maintenance'){
    const sched=prompt('Maintenance schedule (e.g. twice a week):',l.maintenanceSchedule||'twice a week');
    if(sched===null)return; // cancelled
    l.maintenanceSchedule=sched;
  }
  if(status==='active'&&l.phase==='hold'){
    // coming off hold — keep existing acquisition/dt phase
    l.phase=l._prevPhase||'acquisition';
    delete l._prevPhase;
  } else if(status==='hold'){
    l._prevPhase=l.phase;
    l.phase='hold';
  } else {
    l.phase=status==='active'?'acquisition':status;
  }
  saveData();
  const labels={active:'Introduced ✓',maintenance:'On Maintenance ✓',hold:'On Hold ✓'};
  toast(labels[status]||'Updated');
  render();
}

function advancePhase(lId){
  const l=DB.lessons.find(x=>x.id===lId);
  const next=l.phase==='acquisition'?(l.teachingStyle==='NET'?'maintenance':'dt'):l.phase==='dt'?'maintenance':'acquisition';
  if(next==='maintenance'){const s=prompt('Maintenance schedule:','twice a week');if(!s)return;l.maintenanceSchedule=s;}
  l.phase=next;saveData();toast('Phase → '+next.toUpperCase());render();
}

// ── Skip DT step (supervisor only) ──
function skipDTStep(lId){
  if(currentUser.role!=='supervisor'){alert('Supervisors only');return;}
  const l=DB.lessons.find(x=>x.id===lId);
  const dtSteps=l.dtType==='successive'?DT_SUCCESSIVE:DT_SIMULTANEOUS;
  if((l.dtStepIndex||0)<dtSteps.length-1){l.dtStepIndex=(l.dtStepIndex||0)+1;saveData();toast('Skipped to: '+dtSteps[l.dtStepIndex]);render();}
}

  t.name=document.getElementById('et-n').value.trim()||t.name;
  t.trialCount=parseInt(document.getElementById('et-tr').value)||t.trialCount;
  t.status=document.getElementById('et-st').value;
  const noteEl=document.getElementById('et-note');if(noteEl)t.note=noteEl.value.trim();
  if(t.dataType==='ta'){const el=document.getElementById('et-st2');if(el)t.taSteps=el.value.split('\n').map(s=>s.trim()).filter(Boolean);}
  if(['supervisor','director'].includes(currentUser.role)){
    const tsEl=document.getElementById('et-tsteps');
    if(tsEl){
      const newSteps=tsEl.value.split('\n').map(s=>s.trim()).filter(Boolean);
      t.teachingSteps=newSteps;
      // if steps changed, reset dtStepIndex if out of range
      if(t.dtStepIndex>=newSteps.length)t.dtStepIndex=0;
    }
    const dsEl=document.getElementById('et-dtstep');
    if(dsEl){
      const newIdx=parseInt(dsEl.value)||0;
      if(newIdx!==(t.dtStepIndex||0)){
        if(!t.dtStepChanges)t.dtStepChanges=[];
        const today=new Date().toISOString().slice(0,10);
        const scNow=DB.sessions.filter(s=>s.clientId===selectedClientId&&s.lessonData&&s.lessonData.some(ld=>ld.lessonId===lId&&ld.targets&&ld.targets.some(tt=>tt.targetId===tId&&(tt.pct!=null||tt.rating!=null)&&!tt.na))).length;
        t.dtStepChanges.push({from:t.dtStepIndex||0,to:newIdx,date:today,sessionCount:scNow,by:currentUser.id,byName:currentUser.name,reason:'manual_edit'});
        t.dtStepIndex=newIdx;

function renderMaintenanceTab(){
  const lessons=DB.lessons.filter(l=>l.clientId===selectedClientId&&l.phase==='maintenance');
  if(!lessons.length)return '<div class="empty-state">No lessons on maintenance yet.<br><small>Supervisor can move a lesson to Maintenance from the Program Edit tab.</small></div>';
  const maintHtml=lessons.map(lesson=>{
    const allMastered=lesson.sds.flatMap(sd=>sd.targets).filter(t=>t.status==='mastered');
    const rows=allMastered.map(t=>{
      // find last maintenance result from sessions
      const lastResult=(()=>{
        const sess=DB.sessions.filter(s=>s.clientId===selectedClientId).sort((a,b)=>b.date.localeCompare(a.date));
        for(const s of sess){
          const ld=s.lessonData&&s.lessonData.find(x=>x.lessonId===lesson.id);
          if(!ld)continue;
          const te=ld.targets&&ld.targets.find(x=>x.targetId===t.id&&x.dataType==='maintenance');
          if(te)return{result:te.result,date:s.date,tx:s.txName};
        }
        return null;
      })();
      const badge=lastResult?'<span class="badge badge-'+(lastResult.result==='+'?'green':lastResult.result==='-'?'red':'gray')+'" style="font-size:.72rem">'+lastResult.result+' '+lastResult.date.slice(5)+'</span>':'<span style="font-size:.75rem;color:var(--muted)">no data</span>';
      const id='mc_'+lesson.id+'_'+t.id;
      return '<div class="cl-row"><span style="flex:1;font-size:.87rem">'+esc(t.name)+'</span>'+badge+'<div class="cpi-group"><button class="cpi-btn plus" data-id="'+id+'" onclick="toggleCPI(this)">+</button><button class="cpi-btn P" data-id="'+id+'" onclick="toggleCPI(this)">P</button><button class="cpi-btn minus" data-id="'+id+'" onclick="toggleCPI(this)">−</button></div></div>';
    }).join('');
    const schedule=lesson.maintenanceSchedule?'<span style="font-size:.78rem;color:var(--muted);margin-left:8px">📅 '+esc(lesson.maintenanceSchedule)+'</span>':'';
    return '<details class="lesson-card" style="margin-bottom:10px" open><summary style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px 14px;list-style:none;user-select:none"><span style="font-size:1.1rem;margin-right:4px">▶</span><h3 style="flex:1;margin:0">'+esc(lesson.name)+'</h3>'+schedule+'</summary><div class="lesson-body" style="padding:12px 14px">'+(rows||'<p style="color:var(--muted);font-size:.85rem">No mastered targets yet.</p>')+'</div></details>';
  }).join('');
  return '<div style="margin-bottom:16px"><h2>🔁 Maintenance Lessons</h2><p style="font-size:.82rem;color:var(--muted)">Mark each mastered target with +, P, or − then End Session to save.</p></div>'+maintHtml;
}
