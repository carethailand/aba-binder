function renderProgramChecklist(){
  const lessons=DB.lessons.filter(l=>l.clientId===selectedClientId);
  // get all sessions sorted oldest→newest, limit last 30
  const sessions=DB.sessions.filter(s=>s.clientId===selectedClientId)
    .sort((a,b)=>a.date.localeCompare(b.date)).slice(-30);

  if(!lessons.length)return'<div class="empty-state">No lessons yet.</div>';

  // build column headers: date + therapist initial
  const colHeaders=sessions.map(s=>{
    const d=fmtDateShort(s.date);
    const init=s.txName.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    return {date:d,init,sessId:s.id,txName:s.txName,fullDate:s.date};
  });

  // build set of lessonIds run per session
  // sessionLessons: map of sessId -> Map of lessonId -> 'ran'|'na'|undefined
  const sessionLessons={};
  sessions.forEach(s=>{
    const map={};
    (s.lessonData||[]).forEach(ld=>{
      const nonMaint=(ld.targets||[]).filter(t=>t.dataType!=='maintenance');
      if(ld.dtData){map[ld.lessonId]='ran';}
      else if(nonMaint.length>0){
        const allNA=nonMaint.every(t=>t.na);
        map[ld.lessonId]=allNA?'na':'ran';
      }
    });
    sessionLessons[s.id]=map;
  });

  // header row: therapist initials
  let initRow='<tr><td style="background:#dbeafe;font-weight:700;min-width:170px;padding:7px 10px">Initial</td>';
  colHeaders.forEach(h=>{initRow+='<td style="text-align:center;background:#dbeafe;font-weight:600;padding:6px 8px;min-width:52px">'+esc(h.init)+'</td>';});
  initRow+='</tr>';

  // date row
  let dateRow='<tr><td style="background:#dbeafe;font-weight:700;padding:7px 10px">Dates</td>';
  colHeaders.forEach(h=>{dateRow+='<td style="text-align:center;background:#dbeafe;padding:6px 8px;font-size:.82rem">'+esc(h.date)+'</td>';});
  dateRow+='</tr>';

  // empty spacer
  let spacer='<tr><td style="height:10px;background:#f1f5f9" colspan="'+(colHeaders.length+1)+'"></td></tr>';

  // lesson rows
  const lessonRows=lessons.map((l,i)=>{
    const rowBg=i%2===0?'#f0fdf4':'#ffffff';
    let row='<tr><td style="padding:7px 10px;font-size:.87rem;background:'+rowBg+';border-right:2px solid #b3e0f5">'+esc(l.name)+'</td>';
    colHeaders.forEach(h=>{
      const cellVal=sessionLessons[h.sessId]&&sessionLessons[h.sessId][l.id];
      if(cellVal==='ran'){
        row+='<td title="'+esc(h.txName)+' — '+esc(h.fullDate)+'" style="text-align:center;background:'+rowBg+';padding:6px"><div style="width:22px;height:22px;background:#16a34a;border-radius:4px;display:flex;align-items:center;justify-content:center;margin:0 auto;color:#fff;font-size:.8rem">✓</div></td>';
      } else if(cellVal==='na'){
        row+='<td title="No opportunity — '+esc(h.fullDate)+'" style="text-align:center;background:'+rowBg+';padding:6px"><div style="width:22px;height:22px;background:#e5e7eb;border-radius:4px;display:flex;align-items:center;justify-content:center;margin:0 auto;color:#6b7280;font-size:.72rem;font-weight:700">N/A</div></td>';
      } else {
        row+='<td style="text-align:center;background:'+rowBg+';padding:6px"><div style="width:22px;height:22px;border:2px solid #d1d5db;border-radius:4px;margin:0 auto"></div></td>';
      }
    });
    row+='</tr>';
    return row;
  }).join('');

  const tableHtml=sessions.length
    ?'<div style="overflow-x:auto"><table style="border-collapse:collapse;width:auto;min-width:100%">'+initRow+dateRow+spacer+lessonRows+'</table></div>'
    :'<div class="empty-state">No sessions recorded yet. Run a session first.</div>';

  return '<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><h2 style="flex:1">☑ Program Checklist</h2><span style="font-size:.8rem;color:var(--muted)">Last '+sessions.length+' sessions</span><button class="btn btn-outline btn-sm no-print" onclick="window.print()">🖨 Print</button></div>'+tableHtml+'</div>';
}

// BIP — helpers
// ═══════════════════════════════════════════════════════
const BIP_FUNCTIONS=[
  {id:'tangible',label:'Tangible',color:'#d97706'},
  {id:'escape',label:'Escape/Avoidance',color:'#dc2626'},
  {id:'attention',label:'Attention',color:'#1a9fd4'},
  {id:'sensory',label:'Sensory/Automatic',color:'#0891b2'},
  {id:'unknown',label:'Unknown',color:'#6b7280'}
];
function bipFnColor(id){return(BIP_FUNCTIONS.find(f=>f.id===id)||{color:'#6b7280'}).color;}
function bipFnLabel(id){return(BIP_FUNCTIONS.find(f=>f.id===id)||{label:id}).label;}

function bipMeasList(bip){
  if(bip.measurements&&bip.measurements.length)return bip.measurements;
  if(bip.measurement==='multiple')return['frequency','duration'];
  return[bip.measurement||'frequency'];
}
function bipValForMeas(b,meas){
  if(meas==='frequency')return b.count!=null?b.count:null;
  if(meas==='duration'){
    if(b.avgDuration!=null)return b.avgDuration;
    if(b.duration==null)return null;
    const cnt=b.count||1;
    return Math.round(b.duration/cnt*10)/10;
  }
  if(meas==='rate')return b.rate!=null?Math.round(b.rate*10)/10:null;
  return null;
}
function bipVal(b,meas){
  const v=bipValForMeas(b,meas);
  if(v==null)return'—';
  if(meas==='frequency')return v+' ct';
  if(meas==='duration')return v+' min';
  if(meas==='rate')return v+'/hr';
  return v;
}

function switchBIPTab(bipId,tab){
  const card=document.getElementById('bip_'+bipId);
  if(!card)return;
  card.querySelectorAll('.bip-tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  card.querySelectorAll('.bip-tab-pane').forEach(p=>p.classList.toggle('hidden',p.dataset.pane!==tab));
}

// ═══════════════════════════════════════════════════════
// BIP — log
// ═══════════════════════════════════════════════════════
function logBIP(bipId){
  if(!DB.bips)DB.bips=[];
  const bip=DB.bips.find(b=>b.id===bipId);if(!bip)return;
  const isSup2=['supervisor','director'].includes(currentUser.role);
  const date=(isSup2?getSupState():getSessState()).date||new Date().toISOString().slice(0,10);
  const notes=((document.getElementById('bxn_'+bipId)||{}).value||'').trim();
  const allMeas=bipMeasList(bip);
  const allFns=Array.isArray(bip.functions)&&bip.functions.length?bip.functions:['unknown'];
  const fnEl=document.getElementById('bxfn_'+bipId);
  const fn=fnEl?fnEl.value:(allFns[0]||'unknown');
  const entry={id:uid(),clientId:selectedClientId,bipId,date,function:fn,txId:currentUser.id,txName:currentUser.name,notes};
  const freqEl=document.getElementById('bxfreq_'+bipId);
  const durEl=document.getElementById('bxdur_'+bipId);
  const cntEl=document.getElementById('bxcnt_'+bipId);
  if(allMeas.includes('frequency')) entry.count=parseInt(freqEl&&freqEl.value)||0;
  if(allMeas.includes('rate')){
    const sessTimeEl=document.getElementById('sess-time');
    const sessHrs=sessTimeEl?parseFloat(sessTimeEl.value)||1:1;
    const cnt=parseInt(cntEl&&cntEl.value)||0;
    entry.count=(entry.count||0)+cnt;
    entry.rate=sessHrs>0?Math.round(cnt/sessHrs*10)/10:null;
  }
  if(allMeas.includes('duration')){
    const totalDur=parseFloat(durEl&&durEl.value)||0;
    entry.duration=totalDur;
    const occurrences=entry.count||parseInt(cntEl&&cntEl.value)||1;
    entry.avgDuration=totalDur>0?Math.round(totalDur/occurrences*10)/10:0;
  }
  DB.behaviors.push(entry);sbUpsert('behaviors',{id:entry.id,client_id:entry.clientId,bip_id:entry.bipId,date:entry.date,func:entry.function,count:entry.count||null,duration:entry.duration||null,avg_duration:entry.avgDuration||null,rate:entry.rate||null,notes:entry.notes||null,tx_id:entry.txId||null,tx_name:entry.txName||null});
  toast('Logged '+esc(bip.name)+' ('+bipFnLabel(fn)+')');
  render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const _b=DB.bips.find(b=>b.id===bipId);if(_b)drawBIPChart(_b);}));
}

// ═══════════════════════════════════════════════════════
// BIP — draw charts
// ═══════════════════════════════════════════════════════
function drawBIPChart(bip){
  const allMeas=bipMeasList(bip);
  const allFns=Array.isArray(bip.functions)&&bip.functions.length?bip.functions:['unknown'];
  const logs=DB.behaviors.filter(b=>b.clientId===selectedClientId&&b.bipId===bip.id&&(!graphMonth||b.date.slice(0,7)===graphMonth)).sort((a,b)=>a.date.localeCompare(b.date));
  if(logs.length<1)return;
  const measLabels={frequency:'Frequency (count)',duration:'Avg Duration (min)',rate:'Rate (per hr)'};
  const measColors={frequency:'#dc2626',duration:'#1a9fd4',rate:'#d97706'};
  const measYLabels={frequency:'Count',duration:'Avg Duration (min)',rate:'Rate/hr'};

  allMeas.forEach(meas=>{
    const canvas=document.getElementById('bxch_'+bip.id+'_'+meas);
    if(!canvas)return;
    const wrap=canvas.parentElement;
    let _bw=0;let _bel=wrap;while(_bel&&_bw<10){_bw=_bel.offsetWidth;_bel=_bel.parentElement;}
    canvas.width=_bw||document.getElementById('app').offsetWidth||400;
    canvas.height=180;
    const existing=Chart.getChart(canvas);if(existing)existing.destroy();

    // one dataset per function
    // Use individual log entries as points (not aggregated by date)
    const fnLogs=allFns.map(fn=>logs.filter(b=>b.function===fn||(allFns.length===1&&!b.function)));
    const maxLen=Math.max(...fnLogs.map(l=>l.length),1);
    const labels=logs.map(b=>fmtDateShort(b.date)+'\n'+(b.txName?b.txName.split(' ')[0]:''));
    const datasets=allFns.map((fn,fi)=>{
      const color=bipFnColor(fn);
      const fData=logs.map(b=>(b.function===fn||(allFns.length===1&&!b.function))?bipValForMeas(b,meas):null);
      return{label:bipFnLabel(fn),data:fData,borderColor:color,backgroundColor:'transparent',tension:.3,fill:false,pointRadius:4,borderWidth:2,spanGaps:true};
    });

    // goal line
    if(bip.goalValue!=null){
      datasets.push({label:'Goal',data:labels.map(()=>parseFloat(bip.goalValue)),borderColor:'#16a34a',borderDash:[4,4],pointRadius:0,fill:false,borderWidth:1.5,spanGaps:true});
    }

    const yLabel=measYLabels[meas]||meas;
    new Chart(canvas,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:allFns.length>1||bip.goalValue!=null,labels:{boxWidth:12,font:{size:10}}},
        tooltip:{callbacks:{title:ctx=>ctx[0].label}}},
      scales:{y:{beginAtZero:true,title:{display:true,text:yLabel,font:{size:10}}},
        x:{ticks:{font:{size:9},maxRotation:45,minRotation:30}}}}});
  });
}

function saveEditBIP(bipId){
  const bip=DB.bips.find(b=>b.id===bipId);if(!bip)return;

  bip.description=document.getElementById('eb-d').value.trim();

  const newMeas=['frequency','duration','rate'].filter(m=>{const el=document.getElementById(eMeasIdMap[m]);return el&&el.checked;});
  if(newMeas.length){bip.measurements=newMeas;bip.measurement=newMeas[0];}
  const newFns=BIP_FUNCTIONS.map(f=>f.id).filter(id=>{const el=document.getElementById('eb-fn-'+id);return el&&el.checked;});

}

function renderReport(){
  const c=DB.clients.find(x=>x.id===selectedClientId);
  const today=new Date().toISOString().slice(0,10);
  const lessons=DB.lessons.filter(l=>l.clientId===selectedClientId);
  const sessions=DB.sessions.filter(s=>s.clientId===selectedClientId).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
  const lRows=lessons.map(l=>{
    const allT=l.sds.flatMap(sd=>sd.targets);
    const mastTargets=allT.filter(t=>t.status==='mastered');
    const activeT=allT.filter(t=>t.status!=='mastered'&&t.status!=='on_hold');
    let latest='—';
    for(const s of sessions){const ld=s.lessonData&&s.lessonData.find(x=>x.lessonId===l.id);if(ld&&ld.targets){const sc=ld.targets.filter(t=>t.pct!=null);if(sc.length){latest=Math.round(sc.reduce((a,t)=>a+t.pct,0)/sc.length)+'%';break;}}}
    const mastList=mastTargets.length
      ?mastTargets.map(t=>'<div style="font-size:.72rem;margin:1px 0"><span style="background:#dcfce7;color:#166534;border-radius:4px;padding:1px 6px">'+esc(t.name)+'</span>'+(t.masteredDate?' <span style="color:var(--muted)">mastered '+t.masteredDate+'</span>':'')+'</div>').join('')
      :'<span style="color:var(--muted);font-size:.78rem">none yet</span>';
    const activeList=activeT.map(t=>'<div style="font-size:.72rem;margin:1px 0"><span style="background:#dbeafe;color:#1e40af;border-radius:4px;padding:1px 6px">'+esc(t.name)+'</span>'+(t.introducedDate?' <span style="color:var(--muted)">intro '+t.introducedDate+'</span>':'')+'</div>').join('')||'<span style="color:var(--muted);font-size:.78rem">none</span>';
    const sn=l.supNotes&&l.supNotes.length?l.supNotes[l.supNotes.length-1]:null;
    const lIntro=l.sds.flatMap(sd=>sd.targets).map(t=>t.introducedDate).filter(Boolean).sort()[0]||'';
    return '<tr><td><strong>'+esc(l.name)+'</strong>'+(lIntro?'<br><span style="font-size:.72rem;color:var(--muted)">intro '+lIntro+'</span>':'')+'</td><td><span class="badge badge-'+(l.phase==='maintenance'?'green':l.phase==='dt'?'purple':'blue')+'">'+l.phase+'</span></td><td style="font-size:.8rem">'+mastList+'</td><td style="font-size:.8rem">'+activeT.length+' active</td><td>'+latest+'</td><td>'+(sn?esc(sn.text.slice(0,60)):'-')+'</td></tr>';
  }).join('')||'<tr><td colspan="6">No lessons.</td></tr>';
  const bips=(DB.bips||[]).filter(b=>b.clientId===selectedClientId);
  const bipGraphHtml=bips.map(bip=>{
    const allMeas=bipMeasList(bip);
    const measColors={frequency:'#dc2626',duration:'#1a9fd4',rate:'#d97706'};
    const measYLabels={frequency:'Frequency (count)',duration:'Duration (min)',rate:'Rate (per hr)'};
    const logs=DB.behaviors.filter(b=>b.clientId===selectedClientId&&b.bipId===bip.id);
    const graphs=allMeas.map(m=>'<div style="margin-bottom:8px"><div style="font-size:.78rem;font-weight:600;color:'+measColors[m]+'">'+measYLabels[m]+'</div>'+(logs.length>1?'<div style="height:130px"><canvas id="bxch_'+bip.id+'_'+m+'"></canvas></div>':'<p style="font-size:.76rem;color:var(--muted)">Not enough data.</p>')+'</div>').join('');
    return '<div style="margin-bottom:18px"><h4 style="font-size:.9rem;margin-bottom:8px">'+esc(bip.name)+'</h4>'+graphs+'</div>';
  }).join('')||'<p style="color:var(--muted);font-size:.85rem">No BIPs defined.</p>';
  const sNotes=(c.notes||[]).filter(n=>n.type==='supervisor').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(n=>'<div class="note-entry sup-note"><div class="note-meta">'+n.date+'</div><div class="note-text">'+esc(n.text)+'</div></div>').join('');
  return '<div class="flex-end no-print" style="margin-bottom:12px"><button class="btn btn-outline btn-sm" onclick="window.print()">🖨 Print / PDF</button></div><div style="max-width:780px;margin:0 auto"><div class="card" style="border:2px solid var(--primary)"><div style="text-align:center;margin-bottom:18px"><h1 style="font-size:1.4rem;color:var(--primary)">Progress Report</h1><p style="color:var(--muted)">Client: <strong>'+esc(c.name)+'</strong> &nbsp;|&nbsp; '+today+'</p><p style="font-size:.85rem;color:var(--muted)">By: '+esc(currentUser.name)+'</p></div><h3 style="margin-bottom:10px">Lessons</h3><table><thead><tr><th>Lesson</th><th>Phase</th><th>Mastered Targets</th><th>Active</th><th>Latest</th><th>Sup Note</th></tr></thead><tbody>'+lRows+'</tbody></table><hr><h3 style="margin:14px 0 10px">Behavior (BIP Graphs)</h3>'+bipGraphHtml+(sNotes?'<hr><h3 style="margin:14px 0 10px">General Notess</h3>'+sNotes:'')+'<hr><p style="font-size:.76rem;color:var(--muted);text-align:center">For questions contact your therapy team.</p></div></div>';
}

      ?'<button class="btn btn-sm" class="unlock-exempt" style="font-size:.72rem;background:#16a34a;color:#fff;border:none;padding:3px 10px;border-radius:6px;cursor:pointer;white-space:nowrap" data-uid="'+u.id+'" onclick="reactivateUser(this.dataset.uid)">▶ Reactivate</button>'
      :'<button class="btn btn-sm btn-outline unlock-exempt" style="font-size:.72rem;color:#dc2626;border-color:#fca5a5;white-space:nowrap" data-uid="'+u.id+'" onclick="deactivateUser(this.dataset.uid)">Deactivate</button>';
    return '<tr style="opacity:'+(inactive?'.5':'1')+';background:'+(inactive?'#fef2f2':'')+'">'+'<td style="font-weight:500">'+esc(u.name)+(inactive?' <span style="font-size:.68rem;background:#fee2e2;color:#dc2626;padding:1px 5px;border-radius:4px;font-weight:600">inactive</span>':'')+'</td>'+'<td style="color:var(--muted)">'+esc(u.username)+'</td>'+'<td><span style="font-family:monospace;font-size:.82rem;background:#f8fafc;padding:2px 6px;border-radius:4px;border:1px solid var(--border)">'+esc(u.password||'—')+'</span></td>'+'<td>'+roleSelect+'</td>'+'<td><div style="display:flex;flex-wrap:wrap;gap:3px;align-items:center">'+chips+'</div></td>'+'<td>'+statusBtn+'</td>'+'</tr>';
  }).join('');
  return '<h2 style="margin-bottom:16px">⚙ Admin</h2>'
    +'<div class="card"><h3 style="margin-bottom:12px">Add User</h3>'
    +'<div class="form-row"><div class="fg"><label>Full name<input id="au-n" type="text"></label></div>'
    +'<div class="fg"><label>Username<input id="au-u" type="text"></label></div>'
    +'<div class="fg"><label>Password<input id="au-p" type="password"></label></div>'
    +'<div class="fg-sm"><label>Role<select id="au-r"><option value="junior">Junior TX</option><option value="senior">Senior TX</option><option value="supervisor">Supervisor</option><option value="director">Director</option><option value="admin">Admin</option></select></label></div>'
    +'<div><label>&nbsp;</label><button class="btn btn-green" onclick="saveUser()">Add</button></div></div></div>'
    +'<div class="card"><h3 style="margin-bottom:8px">Users &amp; Client Access</h3>'
    +'<p style="font-size:.8rem;color:var(--muted);margin-bottom:10px">Junior/Senior TX only see assigned clients. Click chips to assign/unassign.</p>'
    +'<div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Assigned Clients</th><th></th></tr></thead><tbody>'+userRows+'</tbody></table></div></div>'
    +'<div class="card"><h3 style="margin-bottom:10px">Data &amp; Storage</h3>'
    +'<div id="storage-bar" style="margin-bottom:12px"></div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
    +'<button class="unlock-exempt btn btn-outline" onclick="exportDB()">⬇ Full Export</button>'
    +'<label class="btn btn-outline unlock-exempt" style="cursor:pointer">⬆ Import<input type="file" accept=".json" style="display:none" onchange="importDB(this.files[0])"></label>'
    +'<button class="unlock-exempt btn btn-danger btn-sm" onclick="confirmReset()">⚠ Reset</button>'
    +'</div>'
    +'<hr style="margin:14px 0;border:none;border-top:1px solid var(--border)">'
    +'<h4 style="margin-bottom:8px;font-size:.9rem">📦 Archive Session Data</h4>'
    +'<p style="font-size:.8rem;color:var(--muted);margin-bottom:10px">Exports all sessions &amp; behaviors up to end of selected month, then removes them from the database. Programs &amp; client profiles are kept.</p>'
    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +'<label style="font-size:.82rem">Archive up to end of: <input type="month" id="archive-month" style="margin-left:4px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:.82rem"></label>'
    +'<button class="unlock-exempt btn btn-outline" onclick="archiveSessions()">📦 Archive &amp; Download</button>'
    +'</div>'
    +'<hr style="margin:14px 0;border:none;border-top:1px solid var(--border)">'
    +'<h4 style="margin-bottom:8px;font-size:.9rem">📂 Restore Archive</h4>'
    +'<p style="font-size:.8rem;color:var(--muted);margin-bottom:10px">Load a previously archived JSON file to review old session data. You can archive again when done.</p>'
    +'<label class="btn btn-outline unlock-exempt" style="cursor:pointer">⬆ Load Archive<input type="file" accept=".json" style="display:none" onchange="restoreArchive(this.files[0])"></label>'
    +'</div></div>';
}
function changeRole(userId, newRole){
  const u=DB.users.find(x=>x.id===userId);
  if(!u)return;
  u.role=newRole;
  sbSaveUser(u);
  toast('Role updated ✓');
  render();
}
function toggleAssign(chip){
  const userId=chip.dataset.uid;
  const clientId=chip.dataset.cid;
  const u=DB.users.find(x=>x.id===userId);
  if(!u)return;
  const ac=u.assignedClients||[];
  const on=ac.includes(clientId);
  u.assignedClients=on?ac.filter(id=>id!==clientId):[...ac,clientId];
  // update chip style immediately
  chip.style.background=on?'transparent':'var(--primary)';
  chip.style.color=on?'var(--muted)':'#fff';
  chip.style.borderColor=on?'var(--border)':'var(--primary)';
  sbSaveUser(u);
  toast(on?'Unassigned ✓':'Assigned ✓');
}
function renderStorageBar(){
  try{
    const used=new Blob([localStorage.getItem(STORE_KEY)||'']).size;
    const pct=Math.round(used/5e6*100);
    const color=pct>80?'#dc2626':pct>60?'#d97706':'#059669';
    const el=document.getElementById('storage-bar');
    if(el)el.innerHTML='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:.8rem;color:var(--muted)">Storage used:</span><div style="flex:1;background:#e2e8f0;border-radius:4px;height:8px"><div style="width:'+Math.min(pct,100)+'%;background:'+color+';height:8px;border-radius:4px;transition:width .3s"></div></div><span style="font-size:.8rem;font-weight:600;color:'+color+'">'+Math.round(used/1024)+'KB / ~5MB ('+pct+'%)</span></div>';
  }catch(e){}
}
setTimeout(renderStorageBar,50);

function saveUser(){const n=document.getElementById('au-n').value.trim(),u=document.getElementById('au-u').value.trim(),p=document.getElementById('au-p').value;if(!n||!u||!p){alert('All fields required');return;}if(DB.users.find(x=>x.username===u)){alert('Username taken');return;}const _nu={id:uid(),name:n,username:u,password:p,role:document.getElementById('au-r').value,assignedClients:[]};DB.users.push(_nu);sbSaveUser(_nu);toast('Added ✓');render();}

function deactivateUser(id){
  if(!currentUser||!['director','admin'].includes(currentUser.role)){toast('⚠ No permission');return;}
  if(id===currentUser.id){alert("Can't deactivate yourself");return;}
  const u=DB.users.find(x=>x.id===id);
  if(!u)return;
  const name=u.name;
  window._pendingDeactivateId=id;
  modal('<div style="text-align:center;padding:10px"><div style="font-size:2rem;margin-bottom:8px">🔒</div><h3 style="margin-bottom:8px">Deactivate '+esc(name)+'?</h3><p style="color:var(--muted);margin-bottom:16px">They won\'t be able to log in. Account and all data are kept.</p><div style="display:flex;gap:8px;justify-content:center"><button class="btn btn-danger" onclick="closeModal();confirmDeactivate(window._pendingDeactivateId)">Deactivate</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button></div></div>');
}
async function confirmDeactivate(id){
  const u=DB.users.find(x=>x.id===id);
  if(!u)return;
  u.active=false;
  await sbSaveUser(u);
  toast('Account deactivated ✓');
  render();
}
async function reactivateUser(id){
  if(!currentUser||!['director','admin'].includes(currentUser.role)){toast('⚠ No permission');return;}
  const u=DB.users.find(x=>x.id===id);
  if(!u)return;
  u.active=true;
  await sbSaveUser(u);
  toast('Account reactivated ✓');
  render();
}
function deleteUser(id){
  if(!currentUser||!['director','admin'].includes(currentUser.role)){toast('⚠ No permission');return;}
  if(id===currentUser.id){alert("Can't remove yourself");return;}
  const u=DB.users.find(x=>x.id===id);
  const name=u?u.name:'this user';
  window._pendingDeleteId=id;
  modal('<div style="text-align:center;padding:10px"><div style="font-size:2rem;margin-bottom:8px">⚠️</div><h3 style="margin-bottom:8px">Remove '+esc(name)+'?</h3><p style="color:var(--muted);margin-bottom:16px">This cannot be undone.</p><div style="display:flex;gap:8px;justify-content:center"><button class="btn btn-danger" onclick="closeModal();sbDeleteUser(window._pendingDeleteId)">Yes, Remove</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button></div></div>');
}
function confirmReset(){
  modal('<div style="text-align:center;padding:10px"><div style="font-size:2rem;margin-bottom:8px">🚨</div><h3 style="margin-bottom:8px">Reset ALL Data?</h3><p style="color:var(--muted);margin-bottom:16px">This permanently deletes every client, session, and BIP. Export a backup first.</p><div style="display:flex;gap:8px;justify-content:center"><button class="btn btn-danger" onclick="closeModal();resetData()">Yes, Reset Everything</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button></div></div>');
}

async function resetData(){
  showSyncStatus('saving');
  // Delete all clinical data from Supabase (keep users)
  const tables=['sessions','behaviors','lessons','bips','clients'];
  for(const t of tables){
    const rows=await sbFetch(t,'GET',null,'select=id');
    if(rows&&rows.length) await Promise.all(rows.map(r=>sbFetch(t,'DELETE',null,'id=eq.'+r.id)));
  }
  DB=defaultData();
  await flushSave();
  toast('Reset complete ✓');
  render();
}

// UTILS
// ════════════════════════════════════════════════
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function modal(html){document.getElementById('modal-area').innerHTML='<div style="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:999;overflow-y:auto;padding:20px"><div style="background:#fff;padding:26px;border-radius:14px;width:520px;max-height:90vh;overflow-y:auto">'+html+'</div></div>';}
function closeModal(){const m=document.getElementById('modal-area');if(m)m.innerHTML='';}
function toast(msg,dur=2500){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',dur);}
</script>
