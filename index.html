<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARE Client Binder v2026-06-10-N</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--primary:#29ABE2;--primary-light:#eef2ff;--sup:#059669;--sup-light:#ecfdf5;--danger:#dc2626;--warn:#d97706;--warn-light:#fffbeb;--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--radius:10px;}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
#nav{background:var(--primary);color:#fff;padding:0 20px;display:flex;align-items:center;gap:16px;height:54px;}
#nav h1{font-size:1.1rem;font-weight:700;flex:1;}
#nav-user{font-size:.85rem;opacity:.85;}
.btn-nav{background:rgba(255,255,255,.18);border:none;color:#fff;padding:5px 14px;border-radius:20px;cursor:pointer;font-size:.82rem;}
.btn-nav:hover{background:rgba(255,255,255,.3);}
#app{display:none;max-width:1140px;margin:24px auto;padding:0 16px;}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:8px 18px;border:none;background:none;cursor:pointer;font-size:.9rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.card h2{font-size:1rem;font-weight:600;margin-bottom:14px;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.client-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .15s;}
.client-card:hover{border-color:var(--primary);box-shadow:0 2px 10px rgba(41,171,226,.12);}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end;}
label{font-size:.82rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;}
input,select,textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:.9rem;font-family:inherit;background:#fff;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}
textarea{resize:vertical;min-height:60px;}
.fg{flex:1;min-width:150px;}.fg-sm{min-width:90px;flex:0 0 auto;}.fg-xs{min-width:60px;flex:0 0 auto;}
.btn{padding:8px 18px;border:none;border-radius:7px;font-size:.88rem;font-weight:600;cursor:pointer;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-green{background:var(--sup);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-warn{background:var(--warn);color:#fff;}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
.btn-sm{padding:5px 14px;font-size:.82rem;}
.btn-xs{padding:2px 8px;font-size:.75rem;}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600;}
.badge-green{background:#dcfce7;color:#166534;}
.badge-blue{background:#dbeafe;color:#1e40af;}
.badge-gray{background:#f1f5f9;color:#475569;}
.badge-yellow{background:#fef3c7;color:#92400e;}
.badge-purple{background:#e8f6fd;color:#1a7fad;}
.badge-red{background:#fee2e2;color:#991b1b;}
.badge-orange{background:#ffedd5;color:#9a3412;}
/* Lesson cards */
details.lesson-card>summary::-webkit-details-marker{display:none;}
details summary button{pointer-events:all;}
details summary .status-btn{pointer-events:all;}
details.lesson-card .lesson-body button,details.lesson-card .lesson-body input,details.lesson-card .lesson-body select,details.lesson-card .lesson-body textarea{pointer-events:all;}
details.lesson-card[open]>summary>.det-arrow{transform:rotate(90deg);}
details.lesson-card>summary>span:first-child{transition:transform .15s;display:inline-block;}
.lesson-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
.lesson-header{padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:#fafafa;flex-wrap:wrap;}
.lesson-header h3{flex:1;font-size:1rem;font-weight:700;min-width:120px;}
.lesson-body{padding:16px;}
/* SD blocks */
.sd-block{border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden;}
.sd-header{background:var(--primary-light);padding:9px 14px;display:flex;align-items:center;gap:8px;}
.sd-header h4{flex:1;font-size:.88rem;font-weight:600;color:var(--primary);}
.sd-body{padding:12px;}
/* Target blocks */
.target-block{border:1px solid var(--border);border-radius:7px;padding:11px;margin-bottom:8px;}
.target-status{font-size:.75rem;padding:2px 8px;border-radius:12px;font-weight:600;white-space:nowrap;}
.status-not-started{background:#f1f5f9;color:#475569;}
.status-in-progress{background:#dbeafe;color:#1e40af;}
.status-flagged{background:#fef3c7;color:#92400e;}
.status-mastered{background:#dcfce7;color:#166534;}
/* CPI / +P- buttons */
.cpi-group{display:flex;gap:5px;}
.cpi-btn{min-width:32px;height:30px;padding:0 8px;border:1.5px solid var(--border);background:#fff;border-radius:5px;font-weight:700;cursor:pointer;font-size:.85rem;transition:all .1s;}
.cpi-btn.plus.sel,.cpi-btn.C.sel{background:#16a34a;color:#fff;border-color:#16a34a;}
.cpi-btn.P.sel{background:#d97706;color:#fff;border-color:#d97706;}
.cpi-btn.minus.sel,.cpi-btn.I.sel{background:#dc2626;color:#fff;border-color:#dc2626;}
.cpi-btn.rating-sel{background:#29ABE2;color:#fff;border-color:#29ABE2;}
/* TA step rows */
.ta-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);}
.ta-row:last-child{border-bottom:none;}
/* DT step rows */
.dt-step-row{border:1px solid var(--border);border-radius:7px;padding:10px;margin-bottom:8px;background:#fafafa;}
.dt-step-row.active-dt{background:var(--warn-light);border-color:#fcd34d;}
.dt-step-row.done-dt{background:#f0fdf4;border-color:#86efac;}
/* Graph in session */
.session-graph-wrap{overflow:hidden;}
.session-graph-wrap.hidden{display:none;}
.session-graph-wrap.visible{display:block;}
.chart-wrap{position:relative;height:200px;margin-top:8px;}
.mastered-table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:2px;}
.mastered-table th{background:#f0fdf4;color:#166534;font-weight:700;padding:5px 8px;text-align:left;border-bottom:2px solid #bbf7d0;}
.mastered-table td{padding:5px 8px;border-bottom:1px solid #e5e7eb;vertical-align:top;}
.mastered-table tr:last-child td{border-bottom:none;}
.mastered-section{margin-top:12px;border:1px solid #bbf7d0;border-radius:8px;overflow:hidden;}
.mastered-section-header{background:#f0fdf4;color:#166534;font-weight:700;font-size:.82rem;padding:6px 10px;display:flex;align-items:center;gap:6px;}
details.mastered-target-detail>summary{list-style:none;cursor:pointer;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:.8rem;border-bottom:1px solid #e5e7eb;}
details.mastered-target-detail>summary::-webkit-details-marker{display:none;}
details.mastered-target-detail[open]>summary{border-bottom:1px solid #bbf7d0;}
details.mastered-target-detail .chart-wrap{margin:8px 10px 10px;}
/* BIP tabs */
.bip-tab-nav{display:flex;gap:2px;border-bottom:2px solid #e5e7eb;margin-bottom:12px;flex-wrap:wrap;}
.bip-tab-btn{background:none;border:none;padding:6px 12px;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;border-radius:4px 4px 0 0;transition:all .12s;}
.bip-tab-btn:hover{background:#f1f5f9;color:var(--text);}
.bip-tab-btn.active{color:#29ABE2;border-bottom-color:#29ABE2;background:#eff6ff;}
.bip-tab-pane{padding-top:4px;}.bip-tab-pane.hidden{display:none!important;}
details.card>summary .det-arrow{transition:transform .15s;}
details.card[open]>summary .det-arrow{transform:rotate(90deg);}
/* Lesson status buttons */
.status-btn{padding:3px 10px;border-radius:5px;font-size:.75rem;font-weight:700;border:1.5px solid;cursor:pointer;transition:all .12s;}
.status-btn.active-btn{background:#29ABE2;color:#fff;border-color:#29ABE2;}
.status-btn.maint-btn{background:#059669;color:#fff;border-color:#059669;}
.status-btn.hold-btn{background:#f59e0b;color:#fff;border-color:#f59e0b;}
.status-btn.inactive{background:#fff;color:#94a3b8;border-color:#e2e8f0;}
/* Phase banner */
.phase-banner{padding:7px 12px;border-radius:7px;font-size:.85rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.phase-acquisition{background:#dbeafe;color:#1e40af;}
.phase-dt{background:#e8f6fd;color:#1a7fad;}
.phase-maintenance{background:#dcfce7;color:#166534;}
/* Notes */
.note-entry{border-left:3px solid var(--border);padding:8px 12px;margin-bottom:8px;}
.note-entry.sup-note{border-color:var(--sup);background:var(--sup-light);border-radius:0 7px 7px 0;}
.note-meta{font-size:.75rem;color:var(--muted);margin-bottom:3px;}
.note-text{font-size:.87rem;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
/* Table */
table{width:100%;border-collapse:collapse;font-size:.85rem;}
th{background:var(--primary-light);color:var(--primary);font-weight:600;padding:8px 10px;text-align:left;}
td{padding:7px 10px;border-bottom:1px solid var(--border);}
tr:hover td{background:var(--bg);}
/* Login */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#29ABE2 0%,#1a7fad 100%);}
.login-box{background:#fff;padding:40px;border-radius:16px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.login-err{color:var(--danger);font-size:.82rem;margin-top:8px;display:none;}
/* Misc */
.section-title{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.empty-state{text-align:center;padding:30px;color:var(--muted);}
.flex-end{display:flex;justify-content:flex-end;gap:8px;}
hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
#toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:10px;font-size:.88rem;display:none;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3);}
.sup-badge{background:var(--sup-light);color:var(--sup);font-size:.72rem;padding:1px 7px;border-radius:4px;font-weight:700;}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:.87rem;}
.alert-info{background:#dbeafe;color:#1e40af;}
.alert-warn{background:var(--warn-light);color:#92400e;border:1px solid #fcd34d;}
.mastery-flag{background:var(--warn-light);border:1.5px solid var(--warn);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:.87rem;}
.checklist-wrap{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-top:10px;}
.checklist-wrap h4{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.cl-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:.85rem;}
.cl-row:last-child{border-bottom:none;}
.cl-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;}
.cl-check.done{background:#16a34a;border-color:#16a34a;color:#fff;}
.cl-check.skip{background:#e5e7eb;border-color:#9ca3af;color:#6b7280;}
/* End session bar */
#end-session-bar{background:#fff;border:2px solid var(--primary);border-radius:var(--radius);padding:14px 20px;margin-bottom:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
#end-session-bar h3{flex:1;font-size:.95rem;color:var(--primary);}
#sess-sticky{position:sticky;top:0;z-index:200;padding:8px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.12);}
#sess-sticky.ss-idle{background:#fef2f2;border-bottom:2px solid #ef4444;}
#sess-sticky.ss-active{background:#f0fdf4;border-bottom:2px solid #16a34a;}
#sess-sticky .ss-label{font-size:.75rem;font-weight:700;letter-spacing:.03em;}
#sess-sticky.ss-idle .ss-label{color:#dc2626;}
#sess-sticky.ss-active .ss-label{color:#15803d;}
#sess-sticky .ss-val{font-size:.85rem;font-weight:700;color:#1e293b;}
#sess-sticky input,#sess-sticky select{padding:3px 7px;font-size:.82rem;border-radius:5px;border:1px solid #d1d5db;width:auto;}

/* ── Mobile responsive ── */
@media (max-width: 600px) {
  body{font-size:15px;}

  /* Nav */
  #nav{padding:0 12px;gap:8px;height:48px;}
  #nav h1{font-size:.95rem;}
  #nav-user{font-size:.78rem;}
  .btn-nav{padding:4px 10px;font-size:.76rem;}

  /* Session sticky bar */
  #sess-sticky{padding:6px 10px;gap:6px;}
  #sess-sticky .ss-label{font-size:.68rem;}
  #sess-sticky .ss-val{font-size:.78rem;}
  #sess-sticky input,#sess-sticky select{font-size:.76rem;padding:2px 5px;}
  /* Stack the sticky bar into 2 rows */
  #sess-sticky{flex-wrap:wrap;}

  /* Client list */
  .card-grid{grid-template-columns:1fr;}

  /* Client header row */
  #app > div > div:first-child{flex-wrap:wrap;gap:6px;}

  /* Tabs — horizontal scroll instead of wrap */
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:0;border-bottom:2px solid var(--border);padding-bottom:0;margin-bottom:12px;}
  .tabs::-webkit-scrollbar{height:3px;}
  .tab-btn{white-space:nowrap;flex-shrink:0;padding:8px 12px;font-size:.78rem;}

  /* Lesson cards */
  .lesson-header{padding:10px 12px;gap:6px;}
  .lesson-header h3{font-size:.92rem;}

  /* BIP tabs */
  .bip-tab-nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .bip-tab-btn{white-space:nowrap;flex-shrink:0;font-size:.76rem;padding:5px 10px;}

  /* Buttons in lesson/sd rows */
  .btn-sm{padding:4px 8px;font-size:.74rem;}
  .btn-xs{padding:2px 6px;font-size:.7rem;}

  /* Modal */
  .modal-box{margin:8px;padding:14px;max-height:90vh;overflow-y:auto;}

  /* Graph month row */
  div[style*="align-items:center"][style*="gap:8px"]{flex-wrap:wrap;}

  /* Supervisor/session group headers on client list */
  .card-grid{margin-bottom:4px;}

  /* SD header buttons wrap */
  .sd-header{flex-wrap:wrap;}

  /* Sticky bar — compact 2-row layout */
  #sess-sticky{padding:5px 8px;gap:4px;row-gap:5px;}
  #sess-sticky .ss-label{font-size:.65rem;letter-spacing:.02em;}
  #sess-sticky .ss-val{font-size:.8rem;}
  #sess-sticky input[type="date"]{width:110px!important;font-size:.74rem;}
  #sess-sticky input[type="number"]{width:46px!important;font-size:.74rem;}
  #sess-sticky select{font-size:.74rem;padding:2px 2px;}
  #sess-sticky button{font-size:.74rem!important;padding:5px 10px!important;}
  #sess-sticky div[style*="flex:1"]{display:none;}

  /* Client view header row */
  div.no-print.btn-outline{font-size:.78rem;padding:4px 8px;}

  /* Hide pipe separators on mobile */
  #sess-sticky span[style*="color:#fca5a5"],
  #sess-sticky span[style*="color:#86efac"]{display:none;}

  /* Make the Start/End buttons full-width on their own row */
  #sess-sticky button[onclick*="startSession"],
  #sess-sticky button[onclick*="startSupervision"]{width:100%;margin-top:2px;}
}

@media print{#nav,.tabs,.no-print,button{display:none!important;}body{background:#fff;}.card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid;}}

/* ── Session-locked read-only mode ── */
.session-locked input,
.session-locked textarea,
.session-locked select{pointer-events:none;opacity:.55;background:#f8fafc;}
.session-locked button:not(.unlock-exempt){pointer-events:none;opacity:.45;}
.session-locked .unlock-exempt button{pointer-events:auto!important;opacity:1!important;}
.session-locked .no-session-banner{display:flex;}
.no-session-banner{display:none;align-items:center;gap:8px;background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;padding:8px 14px;margin-bottom:12px;font-size:.85rem;color:#92400e;}

/* ── Supervisor view-only on unassigned cases ── */
.view-only-mode input,
.view-only-mode textarea,
.view-only-mode select{pointer-events:none;opacity:.55;background:#f8fafc;}
.view-only-mode button:not(.unlock-exempt){pointer-events:none;opacity:.45;}
.view-only-mode .unlock-exempt button{pointer-events:auto!important;opacity:1!important;}
.view-only-mode .view-only-banner{display:flex;}
.view-only-mode .no-session-banner{display:none!important;}
.view-only-banner{display:none;align-items:center;gap:8px;background:#fce7f3;border:1px solid #f9a8d4;border-radius:8px;padding:8px 14px;margin-bottom:12px;font-size:.85rem;color:#9d174d;}

.role-select{font-size:.78rem;padding:2px 6px;border-radius:6px;border:1px solid var(--border);}
</style>

// Keepalive: ping Supabase once every 24h so the free-tier project never pauses
(function keepAlive(){
  const INTERVAL=24*60*60*1000;
  function ping(){
    fetch(SUPABASE_URL+'/rest/v1/users?limit=1',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}

// ── Supabase REST helper ──
async function sbFetch(table,method='GET',body=null,params=''){
  const url=SUPABASE_URL+'/rest/v1/'+table+(params?'?'+params:'');
  const opts={method,headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...((method==='POST'||method==='PATCH')?{'Prefer':'return=representation'}:{})}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  if(!r.ok){const t=await r.text();console.error('sbFetch error',table,method,r.status,t);return null;}
  if(method==='DELETE'||r.status===204)return true;
  return r.json();
}
async function sbUpsert(table,body){
  const url=SUPABASE_URL+'/rest/v1/'+table;
  try{
    const r=await fetch(url,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});
    if(!r.ok){const t=await r.text();console.error('sbUpsert error',table,r.status,t);toast('⚠ Save error ('+table+'): '+r.status+' — '+t.slice(0,80),5000);return null;}
    return r.json();
  }catch(e){console.error('sbUpsert fetch failed',table,e);toast('⚠ Network error saving '+table,4000);return null;}
}

// ── Load all data from Supabase ──
async function loadFromSupabase(){
  showSyncStatus('loading');
  try{
    // Fetch each table independently so one failure doesn't block login
    const safe=async(table,params)=>{try{const r=await sbFetch(table,'GET',null,params);return Array.isArray(r)?r:[];}catch(e){console.warn('Load failed:',table,e);return [];}};
    const users   = await safe('users','select=*');
    const clients  = await safe('clients','select=*');
    const lessons  = await safe('lessons','select=*');
    const bips    = await safe('bips','select=*');
    const sessions = await safe('sessions','select=*&order=date.asc');
    const behaviors= await safe('behaviors','select=*&order=date.asc');
    const abcRows  = await safe('abc_data','select=*&order=date.asc');

    console.log('Loaded — users:',users.length,'clients:',clients.length,'lessons:',lessons.length);

    DB.users   = users.map(rowToUser);
    DB.clients  = clients.map(rowToClient);
    DB.lessons  = lessons.map(rowToLesson);
    DB.bips    = bips.map(rowToBIP);
    DB.sessions = sessions.map(rowToSession);
    DB.abcData  = abcRows.map(rowToABC);
    DB.behaviors= behaviors.map(r=>{
      let _bNotes=r.notes||'',_bSetting='therapy';
      try{const _p=typeof r.notes==='string'&&r.notes.startsWith('{')?JSON.parse(r.notes):null;if(_p&&'setting' in _p){_bNotes=_p.text||'';_bSetting=_p.setting||'therapy';}}catch(e){}
      return{id:r.id,clientId:r.client_id,bipId:r.bip_id,date:r.date,function:r.func,count:r.count,duration:r.duration,avgDuration:r.avg_duration,rate:r.rate,notes:_bNotes,setting:_bSetting,txId:r.tx_id,txName:r.tx_name};
    });

    // Migration: sd.note (string) → sd.notes[] (array with timestamp)
    let _sdNoteMigrated=false;
    DB.lessons.forEach(function(lesson){
      lesson.sds.forEach(function(sd){
        if(sd.note&&!(sd.notes&&sd.notes.length)){
          sd.notes=[{date:'unknown',authorId:null,text:sd.note}];
          delete sd.note;
          _sdNoteMigrated=true;
        }
        if(!sd.notes)sd.notes=[];
      });
    });
    if(_sdNoteMigrated){
      console.log('Migrated sd.note strings to sd.notes[]');
      await Promise.all(DB.lessons.filter(function(l){
        return l.sds.some(function(sd){return sd.notes&&sd.notes.length;});
      }).map(function(l){return sbUpsert('lessons',lessonToRow(l));}));
    }

    // Migration: retroactively introduce not_started targets that already have firstTrialData
    let _migratedCount=0;
    DB.lessons.forEach(function(lesson){
      lesson.sds.forEach(function(sd){
        sd.targets.forEach(function(tgt){
          if(tgt.status!=='not_started')return;
          const _ftd=(tgt.firstTrialData||[]).filter(function(f){return f.result&&f.result!=='N/A';});
          if(!_ftd.length)return;
          tgt.status='in_progress';
          if(!tgt.introducedDate){
            // use earliest firstTrialData date
            const _dates=_ftd.map(function(f){return f.date;}).sort();
            tgt.introducedDate=_dates[0];
          }
          _migratedCount++;
        });
      });
    });
    if(_migratedCount>0){
      console.log('Auto-introduced',_migratedCount,'not_started targets with existing data');
      await Promise.all(DB.lessons.filter(function(l){
        return l.sds.some(function(sd){return sd.targets.some(function(t){return t.introducedDate&&t.status==='in_progress';});});
      }).map(function(l){return sbUpsert('lessons',lessonToRow(l));}));
    }

    // Seed default users if none exist
    if(!DB.users.length){
      const def=defaultData();
      await Promise.all(def.users.map(u=>sbUpsert('users',userToRow(u))));
      DB.users=def.users;
      console.log('Seeded default users');
    }
    hideSyncStatus();
    return true;
  }catch(e){
    console.error('loadFromSupabase fatal:',e);
    showSyncStatus('error');
    return false;
  }
}

// ── saveData: push ALL dirty records (called on any change) ──
// We keep DB in memory and push to Supabase on every mutation
let _saveQueue={};
let _saveTimer=null;
function saveData(){
  // Immediate save — no debounce risk
  _saveTimer&&clearTimeout(_saveTimer);
  _saveTimer=setTimeout(flushSave,300);
}
async function flushSave(){
  showSyncStatus('saving');
  try{
    // Save clients first (lessons/bips have FK dependency on clients)
    await Promise.all(DB.clients.map(c=>sbUpsert('clients',clientToRow(c))));
    await Promise.all([
      ...DB.lessons.map(l=>sbUpsert('lessons',lessonToRow(l))),
      ...(DB.bips||[]).map(b=>sbUpsert('bips',bipToRow(b))),
      // behaviors saved individually at log time — do NOT bulk re-save (would overwrite manual corrections with stale null values)
      ...(DB.abcData||[]).map(a=>sbUpsert('abc_data',abcToRow(a))),
    ]);
    hideSyncStatus();
  }catch(e){
    console.error('Save error',e);
    showSyncStatus('error');
  }
}

async function runArchive(){
  const clientId=(document.getElementById('arch-client')||{}).value;
  const fromVal=(document.getElementById('arch-from')||{}).value;
  const toVal=(document.getElementById('arch-to')||{}).value;
  if(!clientId||!fromVal||!toVal){toast('Please fill in all fields.','error');return;}
  const fromDate=fromVal+'-01';
  const toDate=toVal+'-31';
  if(fromVal>toVal){toast('From date must be before To date.','error');return;}

  const client=DB.clients.find(c=>c.id===clientId);
  if(!client){toast('Client not found.','error');return;}

  const archSessions=DB.sessions.filter(s=>s.clientId===clientId&&s.date>=fromDate&&s.date<=toDate);
  const archBehaviors=(DB.behaviors||[]).filter(b=>b.clientId===clientId&&b.date>=fromDate&&b.date<=toDate);
  const archABC=(DB.abcData||[]).filter(a=>a.clientId===clientId&&a.date>=fromDate&&a.date<=toDate);
  const clientLessons=DB.lessons.filter(l=>l.clientId===clientId);
  const clientBips=(DB.bips||[]).filter(b=>b.clientId===clientId);

  if(!archSessions.length&&!archBehaviors.length&&!archABC.length){
    toast('No session, behavior, or ABC data found for that period.','error');return;
  }

  closeModal();
  toast('Generating offline archive…');

  // Build offline HTML
  const html=buildOfflineArchiveHTML(client,clientLessons,clientBips,archSessions,archBehaviors,archABC,fromVal,toVal);
  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const fname=(client.name.replace(/[^a-z0-9]/gi,'_'))+'_archive_'+fromVal+'_to_'+toVal+'.html';
  a.download=fname;
  a.click();

  // Ask before wiping
  setTimeout(()=>{
    if(confirm('Archive file downloaded!\n\nDelete these '+archSessions.length+' sessions and '+archBehaviors.length+' behavior records from the database?\n\nClick OK to delete, Cancel to keep them.')){
      (async()=>{
        toast('Deleting archived records from database…');
        for(const s of archSessions) await sbFetch('sessions','DELETE',null,'id=eq.'+s.id);
        for(const bx of archBehaviors) await sbFetch('behaviors','DELETE',null,'id=eq.'+bx.id);
        const archABC=(DB.abcData||[]).filter(a=>a.clientId===clientId&&a.date>=fromDate&&a.date<=toDate);
        for(const ax of archABC) await sbFetch('abc_data','DELETE',null,'id=eq.'+ax.id);
        DB.sessions=DB.sessions.filter(s=>!(s.clientId===clientId&&s.date>=fromDate&&s.date<=toDate));
        DB.behaviors=(DB.behaviors||[]).filter(b=>!(b.clientId===clientId&&b.date>=fromDate&&b.date<=toDate));
        DB.abcData=(DB.abcData||[]).filter(a=>!(a.clientId===clientId&&a.date>=fromDate&&a.date<=toDate));
        toast('✓ Archive complete — '+archSessions.length+' sessions, '+archBehaviors.length+' behavior records, and '+archABC.length+' ABC entries removed from database.');
        render();
      })();
    } else {
      toast('✓ Archive saved — records kept in database.');
    }
  },1500);
}

function buildOfflineArchiveHTML(client,lessons,bips,sessions,behaviors,abcEntries,fromVal,toVal){
  const esc2=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const fmtD=d=>{if(!d)return'';const p=d.split('-');return p.length<3?d:p[2]+'.'+p[1]+'.'+p[0].slice(2);};
  const sortedSess=sessions.slice().sort((a,b)=>a.date.localeCompare(b.date));

  /* ── SVG CHART HELPERS (self-contained, no CDN) ── */
  function svgLine(data,opts){
    opts=opts||{};
    const W=560,H=150,pad={top:18,right:16,bottom:52,left:44};
    const iW=W-pad.left-pad.right,iH=H-pad.top-pad.bottom;
    const n=data.length;if(!n)return'';
    const vals=data.map(d=>d.v);
    const maxY=opts.maxY||Math.ceil(Math.max.apply(null,vals)*1.25)||1;
    const minY=0;
    const color=opts.color||'#29ABE2';
    const suffix=opts.suffix!==undefined?opts.suffix:'%';
    const toX=i=>pad.left+(n>1?i*(iW/(n-1)):iW/2);
    const toY=v=>pad.top+iH-((v-minY)/(maxY-minY))*iH;
    const nTicks=4;
    let grid='',dots='',xlbls='';
    for(let i=0;i<=nTicks;i++){
      const v=Math.round(maxY/nTicks*i);
      const y=toY(v);
      grid+=`<line x1="${pad.left}" y1="${y}" x2="${pad.left+iW}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`;
      grid+=`<text x="${pad.left-4}" y="${y+4}" text-anchor="end" font-size="10" fill="#94a3b8">${v}${suffix}</text>`;
    }
    const pts=data.map((d,i)=>`${toX(i)},${toY(d.v)}`).join(' ');
    const fill=`${toX(0)},${pad.top+iH} ${pts} ${toX(n-1)},${pad.top+iH}`;
    data.forEach((d,i)=>{
      const cx=toX(i),cy=toY(d.v);
      dots+=`<circle cx="${cx}" cy="${cy}" r="4" fill="${color}" stroke="#fff" stroke-width="2"/>`;
      dots+=`<text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="9" fill="${color}" font-weight="600">${d.v}${suffix}</text>`;
      const lx=cx,ly=pad.top+iH+8;
      xlbls+=`<text transform="rotate(-45,${lx},${ly})" x="${lx}" y="${ly}" text-anchor="end" font-size="9" fill="#64748b">${esc2(d.l)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">
      ${grid}
      <polyline points="${fill}" fill="${color}18" stroke="none"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
      ${dots}
      <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top+iH}" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="${pad.left}" y1="${pad.top+iH}" x2="${pad.left+iW}" y2="${pad.top+iH}" stroke="#cbd5e1" stroke-width="1.5"/>
      ${xlbls}
    </svg>`;
  }

  function ftCircles(data){
    const bgMap={'+':'#dcfce7','I':'#dbeafe','P':'#ede9fe','-':'#fee2e2','C':'#dcfce7'};
    const colMap={'+':'#15803d','I':'#1e40af','P':'#7c3aed','-':'#dc2626','C':'#15803d'};

async function restoreArchive(file){
  const r=new FileReader();
  r.onload=async e=>{
    try{
      const arc=JSON.parse(e.target.result);
      const sessions=arc.sessions||[];
      const behaviors=arc.behaviors||[];
      if(!sessions.length&&!behaviors.length){alert('No session data found in file.');return;}
      if(!confirm('Load '+sessions.length+' sessions and '+behaviors.length+' behavior records from archive '+arc.archiveUpTo+'?\nThis will merge into current data.'))return;

      // Merge — skip duplicates
      const existIds=new Set(DB.sessions.map(s=>s.id));
      const newSess=sessions.filter(s=>!existIds.has(s.id));
      const existBxIds=new Set(DB.behaviors.map(b=>b.id));
      const newBx=behaviors.filter(b=>!existBxIds.has(b.id));

      // Save to Supabase
      for(const s of newSess) await sbUpsert('sessions',sessionToRow(s));
      for(const bx of newBx) await sbUpsert('behaviors',{id:bx.id,client_id:bx.clientId,bip_id:bx.bipId,date:bx.date,func:bx.function,count:bx.count!=null?bx.count:null,duration:bx.duration!=null?bx.duration:null,avg_duration:bx.avgDuration!=null?bx.avgDuration:null,rate:bx.rate!=null?bx.rate:null,notes:bx.notes,tx_id:bx.txId,tx_name:bx.txName});

      DB.sessions=[...DB.sessions,...newSess].sort((a,b)=>a.date.localeCompare(b.date));
      DB.behaviors=[...DB.behaviors,...newBx].sort((a,b)=>a.date.localeCompare(b.date));

      toast('Restored '+newSess.length+' sessions ✓');
      render();
    }catch(x){alert('Invalid archive file.');}
  };
  r.readAsText(file);
}
function exportDB(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='aba_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importDB(file){const r=new FileReader();r.onload=async e=>{try{const imp=JSON.parse(e.target.result);DB=imp;await flushSave();toast('Imported & synced!');render();}catch(x){alert('Invalid file.');}};r.readAsText(file);}

function confirmEndSession(){
  // Count unscored targets
  const lessons=DB.lessons.filter(l=>l.clientId===selectedClientId&&l.phase!=='maintenance'&&l.phase!=='hold');
  let unscored=0;
  lessons.forEach(l=>l.sds.forEach(sd=>sd.targets.filter(t=>t.status!=='mastered'&&t.status!=='on_hold').forEach(t=>{
    const id=l.id+'_'+sd.id+'_'+t.id;
    if(t.dataType==='percent'){
      const corEl=document.getElementById('cor_'+id);
      if(!corEl||corEl.value.trim()==='')unscored++;
    } else if(t.dataType==='rating'){
      const sel=document.querySelector('.cpi-btn[data-id="rt_'+id+'"].rating-sel');
      if(!sel)unscored++;
    } else if(t.dataType==='tally'){
      // tally defaults to 0 — always has a value, never unscored
    } else if(t.dataType==='ta'){
      // ta — check if any step button is selected
      const anyStep=document.querySelector('.cpi-btn[data-id^="ta_'+id+'_"].sel');
      if(!anyStep)unscored++;
    } else if(t.dataType==='checklist'){
      // checklist — needs a first trial selection
      const ftSel=document.querySelector('.ft-btn[data-id="ft_'+id+'"].ft-sel');
      if(!ftSel)unscored++;
    }
  })));
  if(unscored>0){
    modal('<div style="text-align:center;padding:10px">'
      +'<div style="font-size:2rem;margin-bottom:10px">⚠️</div>'
      +'<h3 style="margin-bottom:8px">End Session?</h3>'
      +'<p style="color:var(--muted);margin-bottom:16px"><strong>'+unscored+' target'+(unscored>1?'s have':' has')+' no data</strong> entered yet.<br>You can still save — unscored targets will be left blank.</p>'
      +'<div style="display:flex;gap:8px;justify-content:center">'
      +'<button class="btn btn-danger" onclick="closeModal();saveSession()">End &amp; Save</button>'
      +'<button class="btn btn-outline" onclick="closeModal()">Keep Entering</button>'
      +'</div></div>');
  } else {
    saveSession();
  }
}

function _undoSessionFirstTrials(sess){
  // Remove first-trial data pushed onto targets when this session was originally saved
  DB.lessons.filter(l=>l.clientId===selectedClientId).forEach(function(lesson){
    lesson.sds.forEach(function(sd){
      sd.targets.forEach(function(tgt){
        if(tgt.firstTrialData){
          tgt.firstTrialData=tgt.firstTrialData.filter(function(ft){
            return !(ft.date===sess.date&&ft.txId===sess.txId);
          });
        }
      });
    });
  });
}

      +'<div style="flex:1">'
      +'<div style="font-weight:700;font-size:.92rem">'+fmtDateShort(s.date)+'</div>'
      +'<div style="font-size:.78rem;color:var(--muted);margin-top:2px">'+esc(s.txName||'Unknown TX')+' · '+setting+(time?' · '+time:'')+(lessons?' · '+lessons+' lesson'+(lessons!==1?'s':''):'')+'</div>'
      +'</div>'

      +'</div>';

}

// Build editable BIP behavior log rows for this session's date
function buildBIPRows(sess){
  const bips=(DB.bips||[]).filter(function(b){return b.clientId===selectedClientId;});
  if(!bips.length)return'';
  const logsOnDate=(DB.behaviors||[]).filter(function(b){return b.clientId===selectedClientId&&b.date===sess.date;});
  if(!logsOnDate.length)return'<div style="font-weight:700;font-size:.88rem;margin:14px 0 6px;padding:6px 10px;background:#fef2f2;border-radius:6px;border-left:3px solid #dc2626">🔔 Behavior (BIP)</div><div style="font-size:.78rem;color:var(--muted);padding:0 10px 8px">No BIP logs recorded on this date.</div>';
  let html='<div style="font-weight:700;font-size:.88rem;margin:14px 0 6px;padding:6px 10px;background:#fef2f2;border-radius:6px;border-left:3px solid #dc2626">🔔 Behavior (BIP)</div>';
  logsOnDate.forEach(function(log){
    const bip=bips.find(function(b){return b.id===log.bipId;});
    const bipName=bip?bip.name:log.bipId;
    const allMeas=bip?bipMeasList(bip):['frequency'];
    const hasFreq=allMeas.includes('frequency')||allMeas.includes('rate');
    const hasDur=allMeas.includes('duration');
    html+='<div style="padding:7px 10px;border-bottom:1px solid #f1f5f9">'
      +'<div style="font-size:.82rem;font-weight:600;margin-bottom:6px">'+esc(bipName)
      +'<span style="font-size:.72rem;font-weight:400;color:var(--muted);margin-left:8px">'+esc(log.txName||'')+'</span></div>'
      +'<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">'
      +(hasFreq?'<label style="font-size:.8rem">Count <input type="number" class="se-bip-count" data-bid="'+log.id+'" min="0" style="width:65px;margin-left:4px" value="'+(log.count!=null?log.count:'')+'"></label>':'')
      +(hasDur?'<label style="font-size:.8rem">Duration <input type="text" class="se-bip-dur" data-bid="'+log.id+'" style="width:80px;margin-left:4px" placeholder="min or m:ss" value="'+(log.duration!=null?log.duration:'')+'"></label>':'')
      +'<label style="font-size:.8rem">Notes <input type="text" class="se-bip-notes" data-bid="'+log.id+'" style="width:160px;margin-left:4px" value="'+esc(log.notes||'')+'"></label>'
      +'<button class="btn btn-xs btn-danger" onclick="seDeleteBIPLog(\''+log.id+'\')">✕ Delete</button>'
      +'</div>'
      +'</div>';
  });
  return html;
}
function seDeleteBIPLog(logId){
  if(!confirm('Delete this BIP log entry?'))return;
  const isSup=['supervisor','director'].includes(currentUser&&currentUser.role||'');
  if(!isSup){toast('Only supervisors can delete BIP logs.','error');return;}
  DB.behaviors=(DB.behaviors||[]).filter(function(b){return b.id!==logId;});
  sbFetch('behaviors','DELETE',null,'id=eq.'+logId);
  const cont=document.getElementById('se-bip-section');
  if(cont){
    const sess=(DB.sessions||[]).find(function(s){return s.id===cont.dataset.sessId;});
    if(sess)cont.innerHTML=buildBIPRows(sess);
  }
  toast('BIP log deleted.','success');
}

function _doEditSession(sess){
  // Non-destructive inline editor — shows session data in a modal, saves back via upsert
  const lessons=DB.lessons.filter(l=>l.clientId===selectedClientId).slice().sort((a,b)=>a.name.localeCompare(b.name));

  // Build editable rows per lesson
  function buildLessonRows(sess){
    return lessons.map(function(lesson){
      const ld=(sess.lessonData||[]).find(function(x){return x.lessonId===lesson.id;});
      if(!ld&&lesson.phase==='maintenance')return'';
      const _lid=lesson.id; // always use lesson.id as the data-lid key

      // Merge: saved targets + any active targets not yet recorded
      const savedTargets=ld?ld.targets||[]:[];
      const hasData=savedTargets.filter(t=>t.dataType!=='maintenance').length>0;
      const allActiveTargets=lesson.sds.flatMap(function(sd){
        return sd.targets.filter(function(t){return t.status!=='mastered'&&t.status!=='on_hold';}).map(function(t){
          const saved=savedTargets.find(function(te){return te.targetId===t.id;});
          return saved||{targetId:t.id,targetName:t.name,sdId:sd.id,dataType:t.dataType,_missing:true};
        });
      });

      const targetRows=allActiveTargets.map(function(te){
        if(te.dataType==='maintenance')return'';
        const tName=te.targetName||te.targetId;
        const naChk='<label style="font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:4px"><input type="checkbox" class="se-na" data-lid="'+_lid+'" data-sid="'+te.sdId+'" data-tid="'+te.targetId+'"'+(te.na?' checked':'')+' onchange="seToggleNA(this)"> N/A</label>';
        let inputHtml='';
        if(te.na){
          inputHtml='<span style="font-size:.78rem;color:var(--muted);font-style:italic">marked N/A</span>';
        } else if(te.dataType==='percent'){
          inputHtml='<input type="number" class="se-cor" data-lid="'+_lid+'" data-tid="'+te.targetId+'" min="0" style="width:55px" placeholder="cor" value="'+(te.correct!=null?te.correct:'')+'">'
            +' / <input type="number" class="se-tot" data-lid="'+_lid+'" data-tid="'+te.targetId+'" min="0" style="width:55px" placeholder="tot" value="'+(te.total!=null?te.total:'')+'">'
            +'<span class="se-pct" style="margin-left:8px;font-weight:700;color:var(--primary);min-width:40px">'+(te.pct!=null?te.pct+'%':'')+'</span>';
        } else if(te.dataType==='rating'){
          const _rLesson=DB.lessons.find(l=>l.id===_lid);
          const max=(_rLesson&&_rLesson.ratingScale&&_rLesson.ratingScale.max)||5;
          const opts=Array.from({length:max},(_,i)=>i+1).map(v=>'<option value="'+v+'"'+(te.rating===v?' selected':'')+'>'+v+'</option>').join('');
          inputHtml='<select class="se-rating" data-lid="'+_lid+'" data-tid="'+te.targetId+'"><option value="">—</option>'+opts+'</select>';
        } else if(te.dataType==='tally'){
          inputHtml='<input type="number" class="se-tally" data-lid="'+_lid+'" data-tid="'+te.targetId+'" min="0" style="width:70px" value="'+(te.count!=null?te.count:'')+'">';
        } else if(te.dataType==='checklist'){
          inputHtml='<label style="font-size:.82rem">First trial: <select class="se-ft" data-lid="'+_lid+'" data-tid="'+te.targetId+'"><option value="">—</option><option value="C"'+(te.firstTrial==='C'?' selected':'')+'>C</option><option value="P"'+(te.firstTrial==='P'?' selected':'')+'>P</option><option value="I"'+(te.firstTrial==='I'?' selected':'')+'>I</option><option value="N/A"'+(te.firstTrial==='N/A'?' selected':'')+'>N/A</option></select></label>';
        } else if(te.dataType==='ta'){
          const stepRows=(te.steps||[]).map(function(st,si){
            if(st.mastered)return'<div style="font-size:.75rem;color:#059669">✓ '+esc(st.step||'Step '+(si+1))+'</div>';
            const res=st.result||'';
            return'<div style="font-size:.78rem;display:flex;align-items:center;gap:6px;margin:2px 0">'
              +'<span style="flex:1">'+esc(st.step||'Step '+(si+1))+'</span>'
              +'<select class="se-ta-step" data-lid="'+_lid+'" data-tid="'+te.targetId+'" data-si="'+si+'">'
              +'<option value="">—</option>'
              +'<option value="+"'+(res==='+'?' selected':'')+'>+</option>'
              +'<option value="P"'+(res==='P'?' selected':'')+'>P</option>'
              +'<option value="-"'+(res==='-'?' selected':'')+'>−</option>'
              +'</select>'
              +'</div>';
          }).join('');
          inputHtml='<div style="margin-top:4px">'+stepRows+'</div>';
        }
        let ftHtml='';
        if(te.dataType==='percent'||te.dataType==='ta'){
          ftHtml='<label style="font-size:.75rem;margin-left:12px">1st trial: <select class="se-ft" data-lid="'+_lid+'" data-tid="'+te.targetId+'"><option value="">—</option><option value="+"'+(te.firstTrial==='+'?' selected':'')+'>+</option><option value="P"'+(te.firstTrial==='P'?' selected':'')+'>P</option><option value="-"'+(te.firstTrial==='-'?' selected':'')+'>−</option></select></label>';
        }
        return'<div style="display:flex;align-items:flex-start;gap:8px;padding:5px 10px;border-bottom:1px solid #f1f5f9;flex-wrap:wrap">'
          +'<div style="flex:1;min-width:120px;font-size:.83rem;font-weight:500">'+esc(tName)+(te._missing?'<span style="font-size:.7rem;color:#f59e0b;margin-left:6px">not recorded</span>':'')+'</div>'
          +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+inputHtml+ftHtml+'</div>'
          +naChk
          +'</div>';
      }).join('');

      const noteVal=(ld&&ld.note||'');
      const noteRow='<div style="padding:6px 10px 8px"><label style="font-size:.76rem;color:var(--muted)">Lesson note <input type="text" class="se-lnote" data-lid="'+_lid+'" style="font-size:.8rem;margin-left:6px;width:220px" value="'+esc(noteVal)+'"></label></div>';

      // Wrap in <details> — open if lesson has saved data
      const statusBadge=hasData
        ?'<span style="font-size:.7rem;background:#dcfce7;color:#16a34a;border-radius:10px;padding:1px 8px;margin-left:8px">data recorded</span>'
        :'<span style="font-size:.7rem;background:#fef9c3;color:#92400e;border-radius:10px;padding:1px 8px;margin-left:8px">not recorded</span>';
      return'<details style="border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;overflow:hidden"'+(hasData?' open':'')+'>'
        +'<summary style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:8px 12px;background:#f8fafc;list-style:none;user-select:none">'
        +'<span style="font-size:.85rem">▶</span>'
        +'<span style="font-weight:700;font-size:.88rem;flex:1">'+esc(lesson.name)+'</span>'
        +'<span style="font-size:.74rem;color:var(--muted)">'+lesson.phase+'</span>'
        +statusBadge
        +'</summary>'
        +'<div>'+targetRows+noteRow+'</div>'
        +'</details>';
    }).join('');
  }

  const sessDate=fmtDateShort(sess.date);


  // buildBIPRows is defined as an outer function (before editLastSession)

  const notesRow='<div style="margin:10px 0"><label style="font-size:.85rem;font-weight:600">Session Notes</label><textarea class="se-sess-notes" rows="3" style="font-size:.83rem;margin-top:4px">'+esc(sess.notes||'')+'</textarea></div>';
  const pnRow=sess.setting==='school'?'<div style="margin:8px 0"><label style="font-size:.85rem;font-weight:600">Parent Note</label><textarea class="se-parent-note" rows="2" style="font-size:.83rem;margin-top:4px">'+esc(sess.parentNote||'')+'</textarea></div>':'';

  modal('<div style="max-height:75vh;overflow-y:auto">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
    +'<h3 style="flex:1;margin:0">✏ Edit Session — '+sessDate+'</h3>'
    +'<span style="font-size:.78rem;color:var(--muted)">'+esc(sess.txName||'')+'</span>'
    +'</div>'
    +'<div style="background:#eff6ff;border:1px solid #b3e0f5;border-radius:6px;padding:7px 12px;font-size:.8rem;color:#1a5276;margin-bottom:10px">'
    +'✏ Edit individual values below. Only changed fields are updated — nothing is deleted.'
    +'</div>'
    +buildLessonRows(sess)
    +'<div id="se-bip-section" data-sess-id="'+sess.id+'">'
    +buildBIPRows(sess)
    +'</div>'
    +notesRow+pnRow
    +'<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
    +'<button class="btn btn-primary" onclick="_saveEditedSession(\''+sess.id+'\')">💾 Save Changes</button>'
    +'<button class="btn btn-outline" onclick="closeModal()">Cancel</button>'
    +'</div>'
    +'</div>');

  // Live % recalc
  setTimeout(function(){
    document.querySelectorAll('.se-cor,.se-tot').forEach(function(el){
      el.addEventListener('input',function(){
        const lid=el.dataset.lid,tid=el.dataset.tid;
        const cor=parseFloat(document.querySelector('.se-cor[data-lid="'+lid+'"][data-tid="'+tid+'"]').value)||0;
        const tot=parseFloat(document.querySelector('.se-tot[data-lid="'+lid+'"][data-tid="'+tid+'"]').value)||0;
        const pctEl=el.closest('div').querySelector('.se-pct');
        if(pctEl)pctEl.textContent=tot>0?Math.round(cor/tot*100)+'%':'';
      });
    });
  },80);
}

function seToggleNA(cb){
  const row=cb.closest('div[style]');
  if(!row)return;
  const inputs=row.querySelectorAll('input:not([type=checkbox]),select,textarea');
  inputs.forEach(function(el){el.disabled=cb.checked;el.style.opacity=cb.checked?'.4':'1';});
}

async function _saveEditedSession(sessId){
  const sess=DB.sessions.find(function(s){return s.id===sessId;});
  if(!sess){toast('Session not found','error');return;}

  // Update notes
  const notesEl=document.querySelector('.se-sess-notes');
  if(notesEl)sess.notes=notesEl.value.trim();
  const pnEl=document.querySelector('.se-parent-note');
  if(pnEl)sess.parentNote=pnEl.value.trim();

  // Update lesson data
  if(!sess.lessonData)sess.lessonData=[];
  // Ensure every lesson that has DOM inputs is represented in lessonData
  DB.lessons.filter(l=>l.clientId===selectedClientId).forEach(function(lesson){
    let ld=sess.lessonData.find(function(x){return x.lessonId===lesson.id;});
    if(!ld){
      // Lesson wasn't in original session — create entry only if DOM has data
      const hasAnyInput=document.querySelector('.se-cor[data-lid="'+lesson.id+'"],.se-tally[data-lid="'+lesson.id+'"],.se-rating[data-lid="'+lesson.id+'"],.se-ta-step[data-lid="'+lesson.id+'"],.se-ft[data-lid="'+lesson.id+'"]');
      if(!hasAnyInput)return;
      ld={lessonId:lesson.id,lessonName:lesson.name,targets:[]};
      sess.lessonData.push(ld);
    }
    // Add any missing targets that now have data in DOM
    lesson.sds.forEach(function(sd){
      sd.targets.filter(t=>t.status!=='mastered'&&t.status!=='on_hold').forEach(function(t){
        if(ld.targets.find(function(te){return te.targetId===t.id;}))return; // already exists
        // Check if DOM has any value for this target
        const corEl=document.querySelector('.se-cor[data-lid="'+lesson.id+'"][data-tid="'+t.id+'"]');
        const talEl=document.querySelector('.se-tally[data-lid="'+lesson.id+'"][data-tid="'+t.id+'"]');
        const rEl=document.querySelector('.se-rating[data-lid="'+lesson.id+'"][data-tid="'+t.id+'"]');
        const ftEl=document.querySelector('.se-ft[data-lid="'+lesson.id+'"][data-tid="'+t.id+'"]');
        const taEl=document.querySelector('.se-ta-step[data-lid="'+lesson.id+'"][data-tid="'+t.id+'"]');
        const naEl=document.querySelector('.se-na[data-lid="'+lesson.id+'"][data-tid="'+t.id+'"]');
        const hasValue=(corEl&&corEl.value!=='')||(talEl&&talEl.value!=='')||(rEl&&rEl.value!=='')||(ftEl&&ftEl.value!=='')||(taEl&&taEl.value!=='')||(naEl&&naEl.checked);
        if(hasValue)ld.targets.push({targetId:t.id,targetName:t.name,sdId:sd.id,dataType:t.dataType});
      });
    });
  });
  (sess.lessonData||[]).forEach(function(ld){
    // lesson note
    const lnEl=document.querySelector('.se-lnote[data-lid="'+ld.lessonId+'"]');
    if(lnEl)ld.note=lnEl.value;
    // targets
    (ld.targets||[]).forEach(function(te){
      // NA checkbox
      const naEl=document.querySelector('.se-na[data-lid="'+ld.lessonId+'"][data-tid="'+te.targetId+'"]');
      if(naEl)te.na=naEl.checked;
      if(te.na)return;
      // percent
      if(te.dataType==='percent'){
        const corEl=document.querySelector('.se-cor[data-lid="'+ld.lessonId+'"][data-tid="'+te.targetId+'"]');
        const totEl=document.querySelector('.se-tot[data-lid="'+ld.lessonId+'"][data-tid="'+te.targetId+'"]');
        if(corEl&&corEl.value!==''){te.correct=parseInt(corEl.value)||0;te.total=parseInt(totEl&&totEl.value)||te.total;te.pct=te.total>0?Math.round(te.correct/te.total*100):null;}
      }
      // rating
      if(te.dataType==='rating'){
        const rEl=document.querySelector('.se-rating[data-lid="'+ld.lessonId+'"][data-tid="'+te.targetId+'"]');
        if(rEl&&rEl.value)te.rating=parseInt(rEl.value);
      }
      // tally
      if(te.dataType==='tally'){
        const talEl=document.querySelector('.se-tally[data-lid="'+ld.lessonId+'"][data-tid="'+te.targetId+'"]');
        if(talEl&&talEl.value!=='')te.count=parseInt(talEl.value);
      }
      // TA steps
      if(te.dataType==='ta'){
        document.querySelectorAll('.se-ta-step[data-lid="'+ld.lessonId+'"][data-tid="'+te.targetId+'"]').forEach(function(sel){
          const si=parseInt(sel.dataset.si);
          if(te.steps&&te.steps[si]&&!te.steps[si].mastered)te.steps[si].result=sel.value;
        });
      }
      // first trial (percent, ta, checklist)
      const ftEl=document.querySelector('.se-ft[data-lid="'+ld.lessonId+'"][data-tid="'+te.targetId+'"]');
      if(ftEl&&ftEl.value!==undefined)te.firstTrial=ftEl.value||null;
    });
  });

  // Save BIP log edits
  document.querySelectorAll('.se-bip-count,.se-bip-dur,.se-bip-notes').forEach(function(el){
    const bid=el.dataset.bid;
    const log=(DB.behaviors||[]).find(function(b){return b.id===bid;});
    if(!log)return;
    if(el.classList.contains('se-bip-count')&&el.value!==''){log.count=parseInt(el.value)||0;}
    if(el.classList.contains('se-bip-dur')){
      const rawDur=el.value.trim();
      if(rawDur){
        const mss=rawDur.match(/^(\d+):(\d{1,2})$/);
        const sec=rawDur.match(/^(\d+)s$/i);
        if(mss)log.duration=parseInt(mss[1])+(parseInt(mss[2])/60);
        else if(sec)log.duration=parseInt(sec[1])/60;
        else log.duration=parseFloat(rawDur)||0;
        log.duration=Math.round(log.duration*100)/100;
      }
    }
    if(el.classList.contains('se-bip-notes'))log.notes=el.value;
    sbUpsert('behaviors',{id:log.id,client_id:log.clientId,bip_id:log.bipId,date:log.date,func:log.function,count:log.count!=null?log.count:null,duration:log.duration!=null?log.duration:null,avg_duration:log.avgDuration!=null?log.avgDuration:null,rate:log.rate!=null?log.rate:null,notes:JSON.stringify({text:log.notes||'',setting:log.setting||'therapy'}),tx_id:log.txId||null,tx_name:log.txName||null});
  });

  // Sync firstTrial values back onto target.firstTrialData in DB.lessons
  // so the session tab and graphs reflect edits immediately
  (sess.lessonData||[]).forEach(function(ld){
    const lesson=DB.lessons.find(function(l){return l.id===ld.lessonId;});
    if(!lesson)return;
    (ld.targets||[]).forEach(function(te){
      if(!te.firstTrial)return;
      lesson.sds.forEach(function(sd){
        const tgt=sd.targets.find(function(t){return t.id===te.targetId;});
        if(!tgt)return;
        if(!tgt.firstTrialData)tgt.firstTrialData=[];
        // Remove existing entry for this date+tx then re-add with new value
        tgt.firstTrialData=tgt.firstTrialData.filter(function(f){
          return !(f.date===sess.date&&f.txId===sess.txId);
        });
        tgt.firstTrialData.push({date:sess.date,result:te.firstTrial,txId:sess.txId,txName:sess.txName});
      });
    });
  });
  // Save updated lessons to Supabase
  const editedLessonIds=new Set((sess.lessonData||[]).map(function(ld){return ld.lessonId;}));
  DB.lessons.filter(function(l){return editedLessonIds.has(l.id);}).forEach(function(l){
    sbUpsert('lessons',lessonToRow(l));
  });

  // Upsert — keep same id, just update fields
  const _rowToSave=sessionToRow(sess);
  const result=await sbSaveSession(_rowToSave);
  if(result===null){toast('⚠ Save failed — check connection','error',5000);return;}
  closeModal();
  toast('Session updated ✓');
  render();
}

  const sessions=DB.sessions.filter(s=>s.clientId===selectedClientId).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  if(!sessions.length){toast('No previous sessions found.','error');return;}
  if(sessions.length===1){
    _doDeleteSession(sessions[0]);
  } else {
    modal('<div>'
      +'<h3 style="margin-bottom:4px">🗑 Delete a Session</h3>'
      +'<p style="font-size:.8rem;color:var(--muted);margin-bottom:14px">Select the session to delete. <strong>This cannot be undone.</strong></p>'
      +_sessionPickerRows(sessions)
      +'<div style="margin-top:12px;text-align:right"><button class="btn btn-outline" onclick="closeModal()">Cancel</button></div>'
      +'</div>');
    setTimeout(function(){
      document.querySelectorAll('.sess-pick-btn').forEach(function(btn){
        btn.addEventListener('click',function(){
          const idx=parseInt(btn.dataset.sidx);
          closeModal();
          setTimeout(function(){_doDeleteSession(sessions[idx]);},80);
        });
      });
    },60);
  }
}

async function _doDeleteSession(sess){
  if(!confirm('Delete this session?\n\nDate: '+fmtDateShort(sess.date)+'  TX: '+(sess.txName||'')+'\n\nThis will also delete ABC data and BIP logs from this date. Cannot be undone.'))return;
  // Remove from local DB
  DB.sessions=DB.sessions.filter(s=>s.id!==sess.id);
  _undoSessionFirstTrials(sess);
  // Also remove abc_data and behaviors for this client+date
  const abcsToDelete=(DB.abcData||[]).filter(a=>a.clientId===sess.clientId&&a.date===sess.date);
  const behaviorsToDelete=(DB.behaviors||[]).filter(b=>b.clientId===sess.clientId&&b.date===sess.date);
  DB.abcData=(DB.abcData||[]).filter(a=>!(a.clientId===sess.clientId&&a.date===sess.date));
  DB.behaviors=(DB.behaviors||[]).filter(b=>!(b.clientId===sess.clientId&&b.date===sess.date));
  // Delete from Supabase
  await sbFetch('sessions','DELETE',null,'id=eq.'+sess.id);
  await Promise.all([
    ...abcsToDelete.map(a=>sbFetch('abc_data','DELETE',null,'id=eq.'+a.id)),
    ...behaviorsToDelete.map(b=>sbFetch('behaviors','DELETE',null,'id=eq.'+b.id)),
  ]);
  toast('Session deleted ✓'+(abcsToDelete.length?' ('+abcsToDelete.length+' ABC entries removed)':'')+(behaviorsToDelete.length?' ('+behaviorsToDelete.length+' BIP logs removed)':''));
  render();
}

// ── SVG sparkline for supervision PDF ──
function makeSVGSparkline(scores,masteryPct){
  // scores: [{date,pct}], masteryPct: number
  if(!scores||!scores.length)return'';
  const W=320,H=80,pad=30;
  const vals=scores.map(s=>s.pct);
  const min=0,max=100;
  const xStep=(W-pad*2)/(Math.max(scores.length-1,1));
  const yScale=v=>H-pad-(v-min)/(max-min)*(H-pad*2);
  // polyline points
  const pts=scores.map((s,i)=>(pad+i*xStep).toFixed(1)+','+yScale(s.pct).toFixed(1)).join(' ');
  // mastery line y
  const my=yScale(masteryPct||80).toFixed(1);
  // x-axis labels (every point if <=5, else first/last)
  const labels=scores.map((s,i)=>{
    const x=(pad+i*xStep).toFixed(1);
    const y=(H-8).toFixed(1);
    if(scores.length<=5||i===0||i===scores.length-1)
      return'<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="9" fill="#64748b">'+s.date.slice(5)+'</text>';
    return'';
  }).join('');
  // y-axis labels
  const yLabels=[0,25,50,75,100].map(v=>{
    const y=yScale(v).toFixed(1);
    return'<text x="'+(pad-4)+'" y="'+y+'" text-anchor="end" dominant-baseline="middle" font-size="9" fill="#94a3b8">'+v+'%</text>';
  }).join('');
  // dots
  const dots=scores.map((s,i)=>{
    const cx=(pad+i*xStep).toFixed(1),cy=yScale(s.pct).toFixed(1);
    return'<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#29ABE2" stroke="white" stroke-width="1.5"/>';
  }).join('');
  return'<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" style="display:block;margin:6px 0">'
    +'<rect width="'+W+'" height="'+H+'" fill="#f8fafc" rx="4"/>'
    +'<line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(H-pad)+'" stroke="#e2e8f0" stroke-width="1"/>'
    +'<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#e2e8f0" stroke-width="1"/>'
    +yLabels
    +'<line x1="'+pad+'" y1="'+my+'" x2="'+(W-pad)+'" y2="'+my+'" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>'
    +'<polyline points="'+pts+'" fill="none" stroke="#29ABE2" stroke-width="2" stroke-linejoin="round"/>'
    +dots+labels
    +'</svg>';
}

    });
    // Target changes
    l.sds.forEach(sd=>{
      const snapSd=snapL&&snapL.sds.find(x=>x.id===sd.id);
      sd.targets.forEach(t=>{
        const snapT=snapSd&&snapSd.targets.find(x=>x.id===t.id);
        if(!snapT){
          // Build full target detail for new target

// ── AUTH ──
async function doLogin(){
  const u=document.getElementById('l-user').value.trim();
  const p=document.getElementById('l-pass').value;
  const btn=document.querySelector('#login-screen .btn-primary');
  if(btn){btn.textContent='Loading...';btn.disabled=true;}
  // Load from Supabase first
  const ok=await loadFromSupabase();
  console.log('loadFromSupabase returned:',ok,'users:',DB.users.length);
  if(!ok){
    if(btn){btn.textContent='Log In';btn.disabled=false;}
    document.getElementById('l-err').textContent='Connection error — check internet and try again';
    document.getElementById('l-err').style.display='block';
    return;
  }
  if(!DB.users.length){
    if(btn){btn.textContent='Log In';btn.disabled=false;}
    document.getElementById('l-err').textContent='No users found in database — check Supabase setup';
    document.getElementById('l-err').style.display='block';
    return;
  }
  const user=DB.users.find(x=>x.username===u&&x.password===p);
  console.log('Login attempt — username:',u,'match:',!!user,'all users:',DB.users.map(x=>x.username));
  if(!user){
    if(btn){btn.textContent='Log In';btn.disabled=false;}
    document.getElementById('l-err').textContent='Invalid username or password';
    document.getElementById('l-err').style.display='block';
    return;
  }
  if(user.active===false){
    if(btn){btn.textContent='Log In';btn.disabled=false;}
    document.getElementById('l-err').textContent='This account has been deactivated. Contact your administrator.';
    document.getElementById('l-err').style.display='block';
    return;
  }
  currentUser=user;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('nav').style.display='flex';
  document.getElementById('nav-user').textContent=user.name+' ('+user.role+')';
  document.getElementById('btn-admin').style.display=['director','admin'].includes(user.role)?'':'none';
  document.getElementById('btn-clients').style.display=user.role==='admin'?'none':'';
  document.getElementById('app').style.display='block';
  showView(user.role==='admin'?'admin':'clients');
}
function doLogout(){
  currentUser=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('nav').style.display='none';
  document.getElementById('app').style.display='none';
  // Reset login form
  const lu=document.getElementById('l-user');if(lu)lu.value='';
  const lp=document.getElementById('l-pass');if(lp)lp.value='';
  const le=document.getElementById('l-err');if(le)le.style.display='none';
  const btn=document.querySelector('#login-screen .btn-primary');
  if(btn){btn.textContent='Log In';btn.disabled=false;}
  hideSyncStatus();
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('login-screen').style.display!=='none')doLogin();});

// ── ROUTING ──
function showView(v){currentView=v;render();}
function selectClient(id){
  if(currentUser&&currentUser.role==='admin'){toast('Admin cannot access client sessions');return;}
  if(currentUser&&['junior','senior'].includes(currentUser.role)&&!(currentUser.assignedClients||[]).includes(id)){toast('⚠ Not assigned to this client');return;}
if(selectedClientId!==id)clearSessionDraft();selectedClientId=id;selectedTab='checklist';showView('client');}
function setTab(t){
  if(selectedTab==='session'&&t!=='session')saveSessionDraft();
  selectedTab=t;render();
}
function render(){
  const app=document.getElementById('app');
  if(currentView==='clients')app.innerHTML=(currentUser&&currentUser.role==='admin')?renderAdmin():renderClientList();
  else if(currentView==='client')app.innerHTML=renderClientView();
  else if(currentView==='admin')app.innerHTML=renderAdmin();
  // Restore in-progress session form data after re-render
  if(currentView==='client'&&selectedTab==='session'){
    requestAnimationFrame(()=>restoreSessionDraft());
  }
  // Draw lesson charts AFTER innerHTML is set — must happen here not inside renderLessonsView
  if(currentView==='client'&&selectedTab==='lessons'){
    const lessons=DB.lessons.filter(l=>l.clientId===selectedClientId);
    // Initial draw (open cards only, collapsed cards get drawn on open)
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      lessons.forEach(l=>l.sds.forEach(sd=>sd.targets.forEach(t=>drawLessonChart(l,sd,t))));
      // Redraw when a collapsed card is opened
      document.querySelectorAll('details.lesson-card').forEach(det=>{
        det.addEventListener('toggle',function(){
          if(this.open){
            const l2=DB.lessons.find(x=>x.id===this.dataset.lid);
            if(l2)requestAnimationFrame(()=>l2.sds.forEach(sd=>sd.targets.forEach(t=>drawLessonChart(l2,sd,t))));
          }
        },{once:false});
      });
      document.querySelectorAll('details.mastered-target-detail').forEach(det=>{
        det.addEventListener('toggle',function(){
          if(this.open){
            const key=this.dataset.mdet;if(!key)return;
            const [lId,sdId,tId]=key.split('|');
            const l2=DB.lessons.find(x=>x.id===lId);if(!l2)return;
            const sd2=l2.sds.find(x=>x.id===sdId);if(!sd2)return;
            const t2=sd2.targets.find(x=>x.id===tId);
            if(t2)requestAnimationFrame(()=>drawLessonChart(l2,sd2,t2));
          }
        },{once:false});
      });
      // BIP card toggle — draw charts when opened
      document.querySelectorAll('details.card[id^="bip_"]').forEach(det=>{
        det.addEventListener('toggle',function(){
          if(this.open){
            const bipId=this.id.replace('bip_','');
            const bip=(DB.bips||[]).find(b=>b.id===bipId);
            if(bip)requestAnimationFrame(()=>drawBIPChart(bip));
          }
        },{once:false});
      });
    }));
  }
  // Draw BIP charts after innerHTML is set
  if(currentView==='client'&&(selectedTab==='behavior'||selectedTab==='report')){
    const bips=(DB.bips||[]).filter(b=>b.clientId===selectedClientId);
    requestAnimationFrame(()=>requestAnimationFrame(()=>bips.forEach(bip=>drawBIPChart(bip))));
  }

}

// ── CLIENT LIST ──
function renderClientList(){
  const visibleClients=currentUser&&['junior','senior'].includes(currentUser.role)
    ?DB.clients.filter(c=>(currentUser.assignedClients||[]).includes(c.id))
    :DB.clients;
  if(currentUser&&['junior','senior'].includes(currentUser.role)&&visibleClients.length===0){
    return '<div style="padding:40px;text-align:center"><h2 style="color:var(--muted);font-size:1.1rem">No clients assigned yet.</h2><p style="color:var(--muted);margin-top:8px">Ask your supervisor to assign you to a client in Admin settings.</p></div>';
  }

  function clientCard(c){
    const n=DB.lessons.filter(l=>l.clientId===c.id).length;
    const last=DB.sessions.filter(s=>s.clientId===c.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    const flags=countFlags(c.id);
    return '<div class="client-card" onclick="selectClient(\''+c.id+'\')">'+'<h3 style="font-size:1rem;font-weight:600">'+esc(c.name)+'</h3><p style="font-size:.82rem;color:var(--muted);margin-top:4px">'+esc(c.diagnosis)+' &nbsp;|&nbsp; DOB: '+c.dob+'</p><p style="margin-top:8px;font-size:.82rem">'+n+' lessons &nbsp;'+(flags?'<span class="badge badge-yellow">⛑ '+flags+' flag'+(flags>1?'s':'')+'</span>':'<span class="badge badge-gray">'+(last?'Last: '+last.date:'No sessions')+'</span>')+'</p></div>';
  }

  const addBtn=['supervisor','director'].includes(currentUser.role)?'<button class="btn btn-primary btn-sm no-print" onclick="showAddClient()">+ Add Client</button>':'';
  const header='<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><h2 style="flex:1;font-size:1.3rem">Clients</h2>'+addBtn+'</div>';

  // TX roles: flat list (only see their assigned clients anyway)
  if(currentUser&&['junior','senior'].includes(currentUser.role)){
    return header+'<div class="card-grid">'+visibleClients.map(clientCard).join('')+'</div><div id="modal-area"></div>';
  }

  // Supervisor/director/admin: group by assigned supervisor
  const supUsers=(DB.users||[]).filter(function(u){return['supervisor','director'].includes(u.role);});
  const supMap={};
  supUsers.forEach(function(u){supMap[u.id]=u.name;});

  const UNASSIGNED='__unassigned__';
  const groups={};
  visibleClients.forEach(function(c){
    const sid=c.supervisor||UNASSIGNED;
    if(!groups[sid])groups[sid]=[];
    groups[sid].push(c);
  });

  // Sort: supervisors A-Z, Unassigned last
  const supIds=Object.keys(groups).filter(function(k){return k!==UNASSIGNED;}).sort(function(a,b){
    return (supMap[a]||'').localeCompare(supMap[b]||'');
  });
  if(groups[UNASSIGNED])supIds.push(UNASSIGNED);

  let html=header;
  supIds.forEach(function(sid){
    const label=sid===UNASSIGNED?'Unassigned':(supMap[sid]||'Unknown Supervisor');
    const clients=groups[sid].slice().sort(function(a,b){return a.name.localeCompare(b.name);});
    html+='<div style="margin-bottom:24px">'
      +'<div style="font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:4px 0 8px;border-bottom:1px solid var(--border);margin-bottom:10px">'+esc(label)+'</div>'
      +'<div class="card-grid">'+clients.map(clientCard).join('')+'</div>'
      +'</div>';
  });
  html+='<div id="modal-area"></div>';
  return html;
}
function countFlags(cid){return DB.lessons.filter(l=>l.clientId===cid).reduce((s,l)=>s+l.sds.reduce((s2,sd)=>s2+sd.targets.filter(t=>t.status==='flagged').length,0),0);}

  if(isSup){
    const sv=getSupState();
    if(!sv.clientId||sv.clientId!==selectedClientId){setSupState({clientId:selectedClientId,date:new Date().toISOString().slice(0,10),supType:'overlap',setting:'therapy',started:false});}

        +'<div style="flex:1"></div>'
        +'<button class="unlock-exempt" style="background:#16a34a;color:#fff;border:none;padding:6px 16px;border-radius:7px;font-weight:700;font-size:.83rem;cursor:pointer" onclick="startSupervision()">▶ Start Supervision</button>'
        +'</div>';

      const supTypeLabel=(sv2.supType||'overlap').charAt(0).toUpperCase()+(sv2.supType||'overlap').slice(1);
      const _svSettingActive=sv2.setting||'therapy';
      const supSettingBadge=_svSettingActive==='school'?'<span style="background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 8px;font-size:.75rem;font-weight:700">🏫 School Obs</span>':'';
      supBar='<div id="sess-sticky" class="ss-active">'
        +'<span class="ss-label">✅ SUPERVISION IN PROGRESS</span>'
        +'<span class="ss-val">'+esc(c.name)+'</span>'
        +'<span style="background:#16a34a22;color:#15803d;border-radius:4px;padding:1px 8px;font-size:.75rem;font-weight:700">'+supTypeLabel+'</span>'
        +'<span style="color:#86efac;font-size:.78rem">|</span>'
        +'<span class="ss-label">'+sv2.date+'</span>'
        +'<div style="flex:1"></div>'

        +'<button class="btn btn-outline btn-sm unlock-exempt" onclick="cancelSupervision()">✕ Cancel</button>'
        +'</div>';
    }
    stickyBar=supBar;
  }
  // TX notification badge
  const txNotif=(c.supNotif&&!isSup)?'<div class="alert" style="background:#eff6ff;border:1p'+'x solid #b3e0f5;color:#1a7fad;margin-bottom:8px;display:flex;align-items:center;gap:10px">🔔 <strong>Supervisor updated this client on '+esc(c.supNotif.date)+'</strong> ('+esc(c.supNotif.supType)+') — '+c.supNotif.count+' change'+(c.supNotif.count!==1?'s':'')+' made. <button class="btn btn-xs btn-outline no-print" style="margin-left:auto" onclick="dismissSupNotif()">Dismiss</button></div>':'';
  return stickyBar+'<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><button class="btn btn-outline btn-sm no-print" onclick="showView(\'clients\')">← Clients</button><h2 style="flex:1;font-size:1.2rem">'+esc(c.name)+'</h2><span class="badge badge-gray">'+esc(c.diagnosis)+'</span>'+((['supervisor','director','admin'].includes(currentUser.role))?'<button class="btn btn-outline btn-sm no-print unlock-exempt" onclick="showArchiveModal()" title="Archive old data">📦 Archive</button>':'')+'</div>'+flagBanner+txNotif+'<div class="tabs">'+tabHtml+'</div>'+'<div style="display:flex;align-items:center;gap:8px;padding:6px 16px 2px;flex-wrap:wrap">'+'<span style="font-size:.75rem;color:var(--muted)">Graph month:</span>'+'<input type="month" class="unlock-exempt" style="padding:3px 7px;border:1px solid var(--border);border-radius:6px;font-size:.8rem" value="'+graphMonth+'" onchange="graphMonth=this.value;render()">'+'<button class="btn btn-sm '+(graphMonth===''?'btn-primary':'btn-outline')+' unlock-exempt" onclick="graphMonth=\'\';render()">All</button>'+'</div>'+'<div id="tab-content"'+(isViewOnly()?' class="view-only-mode"':(isSessionActive()?'':' class="session-locked"'))+'><div class="view-only-banner">👁️ View only — '+(currentUser&&currentUser.role==='supervisor'?'not assigned to this client':currentUser.role==='qcd'?'QCD observer':'admin view')+'</div><div class="no-session-banner">👁 '+(['supervisor','director'].includes(currentUser&&currentUser.role||'')?'Start a supervision visit to record data.':' Start a session to record data — you can still view lessons.')+'</div>'+renderTab()+'</div><div id="modal-area"></div>';
}
function isViewOnly(){
  if(!currentUser||!selectedClientId)return false;
  if(currentUser.role==='admin')return true;
  if(currentUser.role==='qcd'){
    const ac=currentUser.assignedClients||[];
    return !ac.includes(selectedClientId);
  }
  // directors can edit all clients
  if(currentUser.role==='director')return false;
  // supervisors can view all but only edit assigned clients
  if(currentUser.role==='supervisor'){
    const ac=currentUser.assignedClients||[];
    return !ac.includes(selectedClientId);
  }
  return false;
}
function isSessionActive(){
  if(!currentUser)return false;
  const isSup=['supervisor','director'].includes(currentUser.role);
  return isSup?!!getSupState().started:!!getSessState().started;
}

// ── Session guard — call at top of any data-entry function ──
function requireActiveSession(){
  const isSup=['supervisor','director'].includes(currentUser&&currentUser.role||'');
  if(isSup){
    const sv=getSupState();
    if(!sv.started||sv.clientId!==selectedClientId){
      toast('⚠ Start a supervision session first before recording data.','error',3500);
      return false;
    }
    return true;
  } else {
    const ss=getSessState();
    if(!ss.started||ss.clientId!==selectedClientId){
      toast('⚠ Start a session first before recording data.','error',3500);
      return false;
    }
    return true;
  }
}
function renderTab(){
  if(selectedTab==='session')return renderSessionEntry();
  if(selectedTab==='schoolinfo')return renderSchoolInfoTab();
  if(selectedTab==='checklist')return renderProgramChecklist();
  if(selectedTab==='lessons')return renderLessonsView();
  if(selectedTab==='maintenance')return renderMaintenanceTab();
  if(selectedTab==='behavior')return renderBehaviorTab();
  if(selectedTab==='abc')return renderABCTab();
  if(selectedTab==='notes')return renderNotesTab();
  if(selectedTab==='report')return renderReport();
  return '';
}
function renderSupLocked(tabName){
  return '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;gap:16px">'
    +'<div style="font-size:3rem">🔒</div>'
    +'<h3 style="margin:0;color:var(--muted)">'+tabName+' is locked</h3>'
    +'<p style="color:var(--muted);font-size:.9rem;text-align:center;max-width:320px">Start a supervision session from the Checklist tab to unlock editing.</p>'
    +'<button class="btn btn-primary" onclick="selectedTab=\'checklist\';render()">Go to Checklist</button>'
    +'</div>';
}

    notes:(document.getElementById('si-notes')||{value:''}).value.trim()
  };

function renderSessionEntry(){
  const ss_check=getSessState();

  const today=new Date().toISOString().slice(0,10);
  const lessons=DB.lessons.filter(l=>l.clientId===selectedClientId).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const active=lessons.filter(l=>l.phase!=='maintenance'&&l.phase!=='hold');
  const maint=lessons.filter(l=>l.phase==='maintenance');
  const held=lessons.filter(l=>l.phase==='hold');
  const blocks=active.map(l=>renderLessonSessionBlock(l)).join('');
  const maintBlock=maint.length?'<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><h2 style="flex:1;margin:0">🔁 Maintenance Lessons</h2><span style="font-size:.8rem;color:var(--muted)">Check each mastered target with +, P, or −</span></div>'+maint.map(l=>renderMaintenanceEntry(l)).join('')+'</div>':'';
  const heldBanner=held.length?'<div class="alert" style="background:#fef3c7;color:#92400e;border:1px solid #fcd34d;margin-bottom:10px">⏸ '+held.length+' lesson'+(held.length>1?'s are':' is')+' on hold (not shown)</div>':'';
  const txNotesCard='<div class="card" style="margin-top:14px">'
    +'<h2 style="margin-bottom:8px">📝 Session Notes</h2>'
    +'<p style="font-size:.78rem;color:var(--muted);margin-bottom:8px">Record anything significant from this session — behavior observations, client mood, parent communication, environment notes, etc. <strong>Tip:</strong> Type as you go — notes are kept until you End Session.</p>'
    +'<textarea id="tx-sess-notes" rows="4" placeholder="e.g. Client was distracted first 30 min, picked up pace after break. Mom mentioned no sleep last night. Tantrum at 2:15pm, resolved in ~3 min with extinction..." style="font-size:.84rem"></textarea>'
    +'</div>';
  // Parent note card — school sessions only
  const _ssNow=getSessState();
  const _parentNoteCard=(_ssNow.setting||'therapy')==='school'?
    '<div class="card" style="margin-top:14px;background:#fffbeb;border:1px solid #fde68a">'
    +'<h2 style="margin-bottom:6px">📝 Daily Parent Note</h2>'
    +'<p style="font-size:.78rem;color:var(--muted);margin-bottom:8px">Brief note visible to parents about how today went.</p>'
    +'<textarea id="parent-note-input" rows="3" placeholder="e.g. Great session today! AVM managed Phonics independently for the first time..." style="font-size:.84rem">'+esc(_ssNow.parentNote||'')+'</textarea>'
    +'</div>':'';
  return heldBanner+(blocks||'<div class="empty-state">No active lessons.</div>')+maintBlock+txNotesCard+_parentNoteCard;
